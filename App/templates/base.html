<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }}</title>
    <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='quant.ico') }}">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #2563eb;
            --secondary-color: #1e40af;
            --background-color: #f1f5f9;
            --card-background: #ffffff;
            --text-primary: #1e293b;
            --text-secondary: #64748b;
            --success-color: #10b981;
            --warning-color: #f59e0b;
            --shadow-sm: 0 1px 3px rgba(0,0,0,0.12);
            --shadow-md: 0 4px 6px rgba(0,0,0,0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Noto Sans SC', sans-serif;
            background-color: var(--background-color);
            color: var(--text-primary);
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .navbar {
            background-color: var(--card-background);
            box-shadow: var(--shadow-md);
            padding: 1rem 2rem;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .nav-container {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .nav-logo {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--primary-color);
            text-decoration: none;
        }

        .nav-menu {
            display: flex;
            gap: 2rem;
            list-style: none;
        }

        .nav-item a {
            color: var(--text-primary);
            text-decoration: none;
            font-weight: 500;
            padding: 0.5rem 1rem;
            border-radius: 0.5rem;
            transition: all 0.3s ease;
        }

        .nav-item a:hover {
            background-color: var(--background-color);
            color: var(--primary-color);
        }

        .nav-item a.active {
            background-color: var(--primary-color);
            color: white;
        }

        main {
            flex: 1;
            padding: 2rem;
            width: 100%;
        }

        footer {
            background-color: var(--card-background);
            padding: 1.5rem;
            text-align: center;
            color: var(--text-secondary);
            box-shadow: var(--shadow-md);
        }

        @media (max-width: 768px) {
            .nav-menu {
                gap: 1rem;
            }

            .nav-item a {
                padding: 0.5rem;
            }
        }

        /* RNN 训练/预测页共享的紧凑排版（原内联于 rnn_training.html，抽到此处供两页一致） */
        .rnn-container { font-size: .95rem; max-width: 1200px; margin: 0 auto; }
        .rnn-container h2 { font-size: 1.35rem; margin-bottom: .85rem; }
        .rnn-container h3 { font-size: 1.12rem; }
        .rnn-container .card { margin-bottom: .75rem !important; }
        .rnn-container table th, .rnn-container table td { padding: .4rem .55rem !important; }
        .rnn-container .form-select, .rnn-container .form-input { font-size: .92rem; padding: .35rem .5rem; }
        .rnn-container .btn { font-size: .9rem; }

        /* 页内 tab 切换条（训练管理/模型预测等）。原样式只内联在 download_fund_data.html，
           其它页用 class="tab-btn" 却没样式 → 渲染成两个无区分的普通链接。抽到此处共享，
           带明确的 active 高亮。自带内联同名样式的页面（层叠在后）不受影响。 */
        .page-tabs { display: flex; gap: .25rem; margin-bottom: 1.25rem; background: var(--card-background, #fff); border-radius: .6rem; padding: .35rem; box-shadow: var(--shadow-sm, 0 1px 2px rgba(0,0,0,.05)); }
        .tab-btn { padding: .5rem 1.25rem; border: none; background: transparent; color: var(--text-secondary, #6b7280); font-size: .95rem; font-weight: 500; cursor: pointer; border-radius: .45rem; text-decoration: none; transition: all .2s ease; }
        .tab-btn:hover { background: var(--background-color, #f3f4f6); }
        .tab-btn.active { background: var(--primary-color, #2563eb); color: #fff; }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <a href="{{ url_for('main_bp.index') }}" class="nav-logo">智能股票交易系统</a>
            <ul class="nav-menu">
                <li class="nav-item">
                    <a href="{{ url_for('dl_bp.dl') }}" {% if request.endpoint == 'dl_bp.dl' %}class="active"{% endif %}>数据获取</a>
                </li>
                <li class="nav-item">
                    <a href="{{ url_for('RnnData.rnn_data_page') }}" {% if request.endpoint == 'RnnData.rnn_data_page' %}class="active"{% endif %}>RNN模型</a>
                </li>
                <li class="nav-item">
                    <a href="{{ url_for('screener.page') }}" {% if request.endpoint == 'screener.page' %}class="active"{% endif %}>个股筛选</a>
                </li>
                <li class="nav-item">
                    <a href="{{ url_for('issue_bp.issues') }}" {% if request.endpoint == 'issue_bp.issues' %}class="active"{% endif %}>问题管理</a>
                </li>
            </ul>
        </div>
    </nav>

    <main>
        {% block content %}
        {% endblock %}
    </main>

    <footer>
        <p>© {{ year }} 智能股票交易系统. All rights reserved.</p>
    </footer>
</body>
</html>
