{% extends "base.html" %}
{% block content %}
<script src="{{ url_for('static', filename='js/echarts.js') }}"></script>
<div class="viewer-container">
    <!-- 顶部标题栏 -->
    <div class="viewer-header">
        <div class="header-left">
            <button class="btn-toggle-panel" onclick="togglePanel()" title="展开/收起股票列表">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M3 12h18M3 6h18M3 18h18"/>
                </svg>
                <span style="margin-left:4px;font-size:0.8rem;">选股</span>
            </button>
            <div>
                <h2>15分钟数据查看器</h2>
                <p class="header-desc">data/15m/ · <span id="headerStockInfo">未选择股票</span></p>
            </div>
        </div>
        <div class="header-actions">
            <div class="quick-search-wrap">
                <input type="text" id="quickSearchInput" placeholder="输入代码或名称搜索..." class="quick-search-input"
                       autocomplete="off" onfocus="onQuickSearchFocus()" oninput="onQuickSearchInput()">
                <div class="quick-search-dropdown" id="quickSearchDropdown"></div>
            </div>
            <button class="btn-refresh" onclick="refreshAll()">刷新</button>
        </div>
    </div>


    <!-- 主内容 -->
    <div class="main-content">
        <!-- 左侧抽屉：股票列表 -->
        <div class="stock-drawer" id="stockDrawer">
            <div class="drawer-header">
                <h3>股票列表</h3>
                <span class="panel-info" id="stockListInfo">加载中...</span>
            </div>
            <div class="drawer-search">
                <input type="text" id="searchInput" placeholder="搜索代码或名称..." class="search-input-drawer">
                <select id="sortSelect" onchange="loadStockList(1)" class="sort-select-drawer">
                    <option value="records">按记录数</option>
                    <option value="date">按更新时间</option>
                    <option value="code">按代码</option>
                </select>
            </div>
            <div class="stock-list" id="stockList">
                <div class="loading-msg">加载中...</div>
            </div>
            <div class="pagination" id="stockPagination">
                <button class="btn-page" id="stockPrevBtn" onclick="loadStockList(currentPage - 1)" disabled>上一页</button>
                <span id="stockPageInfo">第 1 页</span>
                <button class="btn-page" id="stockNextBtn" onclick="loadStockList(currentPage + 1)" disabled>下一页</button>
            </div>
        </div>
        <!-- 遮罩层 -->
        <div class="drawer-overlay" id="drawerOverlay" onclick="togglePanel()"></div>

        <!-- 右侧：15m数据 -->
        <div class="detail-panel">
            <div class="panel-header">
                <h3 id="detailTitle">15分钟数据</h3>
                <div class="detail-controls">
                    <div class="view-toggle">
                        <button class="btn-view active" id="btnChartView" onclick="switchView('chart')">K线图</button>
                        <button class="btn-view" id="btnTableView" onclick="switchView('table')">数据表</button>
                    </div>
                    <input type="date" id="filterStartDate" title="开始日期">
                    <input type="date" id="filterEndDate" title="结束日期">
                    <button class="btn-filter" onclick="onFilter()">筛选</button>
                </div>
            </div>

            <!-- 股票摘要 -->
            <div class="stock-summary" id="stockSummary">
                <div class="summary-placeholder">点击左上角菜单按钮选择股票</div>
            </div>

            <!-- K线图区域 -->
            <div class="chart-section" id="chartSection">
                <div class="chart-toolbar">
                    <div class="chart-range-btns">
                        <button class="range-btn active" onclick="setChartRange(100)">100根</button>
                        <button class="range-btn" onclick="setChartRange(200)">200根</button>
                        <button class="range-btn" onclick="setChartRange(500)">500根</button>
                    </div>
                    <div class="chart-info" id="chartCrosshairInfo"></div>
                </div>
                <div id="klineChart" style="width:100%; height:800px;"></div>
            </div>

            <!-- 数据表格 -->
            <div class="table-wrapper" id="tableSection" style="display:none;">
                <table class="data-table" id="dataTable">
                    <thead>
                        <tr class="group-header-row">
                            <th colspan="7" class="group-header gh-market">K线数据</th>
                            <th colspan="3" class="group-header gh-macd">MACD</th>
                            <th colspan="3" class="group-header gh-signal">信号</th>
                            <th colspan="4" class="group-header gh-boll">布林带</th>
                            <th colspan="4" class="group-header gh-cycle">周期</th>
                            <th colspan="2" class="group-header gh-vol">量能</th>
                        </tr>
                        <tr class="field-header-row">
                            <!-- K线 7 -->
                            <th class="sticky-col">时间</th>
                            <th>开盘</th><th>收盘</th><th>最高</th><th>最低</th>
                            <th>成交量</th><th>成交额</th>
                            <!-- MACD 3 -->
                            <th>DIF</th><th>DEA</th><th>MACD</th>
                            <!-- 信号 3 -->
                            <th>方向</th><th>选择</th><th>起始</th>
                            <!-- 布林 4 -->
                            <th>中轨</th><th>上轨</th><th>下轨</th><th>止损</th>
                            <!-- 周期 4 -->
                            <th>振幅/bar</th><th>振幅max</th><th>周期长</th><th>最大长</th>
                            <!-- 量能 2 -->
                            <th>量max1</th><th>量max5</th>
                        </tr>
                    </thead>
                    <tbody id="dataTableBody">
                        <tr><td colspan="23" class="empty-cell">点击左上角菜单按钮选择股票</td></tr>
                    </tbody>
                </table>
            </div>

            <!-- 数据分页 -->
            <div class="pagination" id="dataPagination" style="display:none;">
                <button class="btn-page" id="dataPrevBtn" onclick="load15mData(currentDataPage - 1)" disabled>上一页</button>
                <span id="dataPageInfo">第 1 页</span>
                <button class="btn-page" id="dataNextBtn" onclick="load15mData(currentDataPage + 1)" disabled>下一页</button>
            </div>
        </div>
    </div>
</div>

<style>
/* ===== 全宽布局 ===== */
.viewer-container { width: 100%; padding: 1rem 1.5rem; }

/* ===== 顶部标题 ===== */
.viewer-header {
    display: flex; justify-content: space-between; align-items: center;
    background: linear-gradient(135deg, #0891b2, #0e7490);
    color: white; padding: 0.75rem 1.5rem; border-radius: 0.75rem; margin-bottom: 1rem;
}
.header-left { display: flex; align-items: center; gap: 0.75rem; }
.viewer-header h2 { margin: 0; font-size: 1.25rem; }
.header-desc { margin: 0.15rem 0 0; font-size: 0.8rem; opacity: 0.85; }
.header-actions { display: flex; gap: 0.5rem; align-items: center; }

/* ===== 快速搜索 ===== */
.quick-search-wrap { position: relative; }
.quick-search-input {
    padding: 0.45rem 0.75rem; border: none; border-radius: 0.5rem;
    font-size: 0.85rem; width: 220px; background: rgba(255,255,255,0.9); outline: none;
}
.quick-search-input:focus { background: white; box-shadow: 0 0 0 2px rgba(255,255,255,0.4); }
.quick-search-dropdown {
    display: none; position: absolute; top: 100%; left: 0; right: 0;
    margin-top: 4px; background: white; border-radius: 0.5rem;
    box-shadow: 0 8px 24px rgba(0,0,0,0.15); max-height: 320px; overflow-y: auto;
    z-index: 300; min-width: 280px;
}
.quick-search-dropdown.show { display: block; }
.qs-item {
    display: flex; justify-content: space-between; align-items: center;
    padding: 0.55rem 0.75rem; cursor: pointer; border-bottom: 1px solid #f3f4f6;
    color: #1f2937; font-size: 0.82rem;
}
.qs-item:last-child { border-bottom: none; }
.qs-item:hover { background: #ecfeff; }
.qs-code { font-weight: 600; }
.qs-name { color: #6b7280; margin-left: 0.5rem; }
.qs-meta { font-size: 0.72rem; color: #9ca3af; }
.qs-empty { padding: 1rem; text-align: center; color: #9ca3af; font-size: 0.82rem; }

.btn-refresh {
    padding: 0.45rem 1rem; background: rgba(255,255,255,0.2); color: white;
    border: 1px solid rgba(255,255,255,0.3); border-radius: 0.5rem;
    cursor: pointer; font-size: 0.85rem;
}
.btn-refresh:hover { background: rgba(255,255,255,0.3); }
.btn-toggle-panel {
    display: flex; align-items: center; justify-content: center;
    width: 36px; height: 36px; border: 1px solid rgba(255,255,255,0.3);
    border-radius: 0.5rem; background: rgba(255,255,255,0.15);
    color: white; cursor: pointer; flex-shrink: 0;
}
.btn-toggle-panel:hover { background: rgba(255,255,255,0.3); }

/* ===== 主内容 ===== */
.main-content { position: relative; }

/* ===== 左侧抽屉 ===== */
.stock-drawer {
    position: fixed; top: 0; left: -340px; width: 340px; height: 100vh;
    background: var(--card-background); box-shadow: 4px 0 20px rgba(0,0,0,0.15);
    z-index: 200; display: flex; flex-direction: column; transition: left 0.3s ease;
}
.stock-drawer.open { left: 0; }
.drawer-overlay {
    display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.3); z-index: 199;
}
.drawer-overlay.show { display: block; }
.drawer-header {
    display: flex; justify-content: space-between; align-items: center;
    padding: 1rem 1rem 0.75rem; border-bottom: 1px solid #e5e7eb; flex-shrink: 0;
}
.drawer-header h3 { margin: 0; font-size: 1rem; font-weight: 600; }
.panel-info { font-size: 0.8rem; color: var(--text-secondary); }
.drawer-search {
    display: flex; gap: 0.4rem; padding: 0.6rem 0.75rem;
    border-bottom: 1px solid #e5e7eb; flex-shrink: 0;
}
.search-input-drawer {
    flex: 1; padding: 0.4rem 0.6rem; border: 1px solid #d1d5db;
    border-radius: 0.4rem; font-size: 0.82rem; outline: none;
}
.search-input-drawer:focus { border-color: #0891b2; }
.sort-select-drawer {
    padding: 0.35rem 0.4rem; border: 1px solid #d1d5db;
    border-radius: 0.4rem; font-size: 0.78rem; background: white;
}
.stock-list { flex: 1; overflow-y: auto; padding: 0.5rem; }
.stock-item {
    display: flex; justify-content: space-between; align-items: center;
    padding: 0.6rem 0.75rem; border-radius: 0.5rem; cursor: pointer;
    transition: background 0.15s; border-left: 3px solid transparent;
}
.stock-item:hover { background: var(--background-color); }
.stock-item.active { background: rgba(8,145,178,0.08); border-left-color: #0891b2; }
.stock-info { flex: 1; min-width: 0; }
.stock-code { font-weight: 600; font-size: 0.9rem; }
.stock-name { font-size: 0.75rem; color: var(--text-secondary); }
.stock-meta { text-align: right; font-size: 0.72rem; color: var(--text-secondary); flex-shrink: 0; margin-left: 0.5rem; }
.stock-records { color: #0891b2; font-weight: 500; }
.stock-dates { margin-top: 2px; }

/* ===== 详情面板 ===== */
.detail-panel {
    background: var(--card-background); border-radius: 0.75rem;
    box-shadow: var(--shadow-sm); overflow: hidden; width: 100%;
}
.panel-header {
    display: flex; justify-content: space-between; align-items: center;
    padding: 0.75rem 1rem; background: var(--background-color); border-bottom: 1px solid #e5e7eb;
}
.panel-header h3 { margin: 0; font-size: 1rem; font-weight: 600; }
.detail-controls { display: flex; align-items: center; gap: 0.4rem; }
.detail-controls input[type="date"] {
    padding: 0.25rem 0.4rem; border: 1px solid #e5e7eb; border-radius: 0.25rem; font-size: 0.78rem;
}
.btn-filter {
    padding: 0.3rem 0.75rem; background: #0891b2; color: white;
    border: none; border-radius: 0.25rem; cursor: pointer; font-size: 0.78rem;
}
.btn-filter:hover { background: #0e7490; }

/* ===== 摘要 ===== */
.stock-summary { padding: 0.75rem 1rem; border-bottom: 1px solid #e5e7eb; }
.summary-placeholder { text-align: center; color: var(--text-secondary); padding: 0.5rem; }
.summary-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 0.75rem; }
.summary-item { text-align: center; padding: 0.5rem; background: var(--background-color); border-radius: 0.5rem; }
.summary-value { font-size: 1rem; font-weight: 600; color: var(--text-primary); }
.summary-label { font-size: 0.7rem; color: var(--text-secondary); }

/* ===== 表格 ===== */
.table-wrapper { max-height: calc(100vh - 340px); overflow: auto; }
.data-table { width: 100%; border-collapse: collapse; font-size: 0.78rem; }
.data-table th, .data-table td {
    padding: 0.35rem 0.5rem; text-align: right; border-bottom: 1px solid #e5e7eb; white-space: nowrap;
}
.data-table th { font-weight: 600; position: sticky; top: 0; z-index: 1; }
.data-table td:first-child {
    text-align: left; position: sticky; left: 0; z-index: 2;
    background: var(--card-background); box-shadow: 2px 0 4px rgba(0,0,0,0.06);
}
.data-table th:first-child {
    text-align: left; position: sticky; left: 0; z-index: 3;
    box-shadow: 2px 0 4px rgba(0,0,0,0.06);
}
.data-table tr:hover { background: rgba(8,145,178,0.04); }
.empty-cell { text-align: center !important; color: var(--text-secondary); padding: 2rem !important; }
.loading-msg { text-align: center; color: var(--text-secondary); padding: 2rem; }

/* ===== 分组表头 ===== */
.group-header-row th {
    text-align: center !important; font-size: 0.72rem; font-weight: 700;
    letter-spacing: 0.5px; padding: 0.35rem 0.25rem; border-bottom: none; color: white; top: 0;
}
.gh-market  { background: #0891b2; }
.gh-macd    { background: #7c3aed; }
.gh-signal  { background: #d97706; }
.gh-boll    { background: #2563eb; }
.gh-cycle   { background: #059669; }
.gh-vol     { background: #dc2626; }

/* ===== 字段表头 ===== */
.field-header-row th {
    top: 29px; font-size: 0.72rem; font-weight: 600;
    padding: 0.35rem 0.5rem; color: #1e293b; border-bottom: 2px solid #cbd5e1;
}
.field-header-row th:nth-child(-n+7)                        { background: #cffafe; }
.field-header-row th:nth-child(n+8):nth-child(-n+10)        { background: #ede9fe; }
.field-header-row th:nth-child(n+11):nth-child(-n+13)       { background: #fef3c7; }
.field-header-row th:nth-child(n+14):nth-child(-n+17)       { background: #dbeafe; }
.field-header-row th:nth-child(n+18):nth-child(-n+21)       { background: #d1fae5; }
.field-header-row th:nth-child(n+22)                        { background: #fee2e2; }

/* ===== 视图切换 ===== */
.view-toggle {
    display: flex; border: 1px solid #d1d5db; border-radius: 0.35rem; overflow: hidden; margin-right: 0.5rem;
}
.btn-view {
    padding: 0.25rem 0.7rem; border: none; background: white; color: #6b7280;
    font-size: 0.78rem; cursor: pointer; transition: all 0.15s; font-weight: 500;
}
.btn-view.active { background: #0891b2; color: white; }
.btn-view:hover:not(.active) { background: #f3f4f6; }

/* ===== K线图区域 ===== */
.chart-section {
    background: var(--card-background); border-bottom: 1px solid #e5e7eb;
}
.chart-toolbar {
    display: flex; justify-content: space-between; align-items: center;
    padding: 0.5rem 1rem; border-bottom: 1px solid #f1f5f9;
}
.chart-range-btns { display: flex; gap: 0.3rem; }
.range-btn {
    padding: 0.2rem 0.6rem; border: 1px solid #d1d5db; background: white;
    border-radius: 0.25rem; font-size: 0.72rem; cursor: pointer; color: #6b7280;
}
.range-btn.active { background: #0891b2; color: white; border-color: #0891b2; }
.range-btn:hover:not(.active) { background: #f3f4f6; }
.chart-info { font-size: 0.75rem; color: var(--text-secondary); }

/* ===== 信号标记 ===== */
.signal-up { color: #ef4444; font-weight: 600; }
.signal-down { color: #10b981; font-weight: 600; }
.macd-pos { color: #ef4444; }
.macd-neg { color: #10b981; }

/* ===== 分页 ===== */
.pagination {
    display: flex; justify-content: center; align-items: center;
    gap: 0.5rem; padding: 0.6rem; background: var(--background-color); flex-shrink: 0;
}
.btn-page {
    padding: 0.25rem 0.75rem; border: none; border-radius: 0.25rem;
    font-size: 0.75rem; cursor: pointer; background: #0891b2; color: white;
}
.btn-page:disabled { opacity: 0.5; cursor: not-allowed; }

/* ===== 响应式 ===== */
@media (max-width: 768px) {
    .viewer-header { flex-direction: column; gap: 0.75rem; }
    .summary-grid { grid-template-columns: repeat(4, 1fr); }
    .stock-drawer { width: 300px; left: -300px; }
}
</style>

<script>
let currentPage = 1, totalPages = 1;
let currentDataPage = 1, totalDataPages = 1;
let selectedStock = null;
let searchTimeout = null;
let drawerOpen = false;
let currentView = 'chart';  // 'chart' or 'table'
let klineChart = null;
let chartDataCache = null;  // 缓存图表数据
let chartRange = 100;

document.addEventListener('DOMContentLoaded', function() {
    loadStockList(1);

    document.getElementById('searchInput').addEventListener('input', function() {
        clearTimeout(searchTimeout);
        searchTimeout = setTimeout(() => loadStockList(1), 300);
    });

    document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape' && drawerOpen) togglePanel();
    });

    // 支持 ?stock=xxx 参数自动加载
    const urlParams = new URLSearchParams(window.location.search);
    const stockParam = urlParams.get('stock');
    if (stockParam) {
        selectStock(stockParam, '');
    }
});

/* ===== 抽屉控制 ===== */
function togglePanel() {
    drawerOpen = !drawerOpen;
    document.getElementById('stockDrawer').classList.toggle('open', drawerOpen);
    document.getElementById('drawerOverlay').classList.toggle('show', drawerOpen);
}

/* ===== 股票列表 ===== */
function loadStockList(page) {
    currentPage = page;
    const search = document.getElementById('searchInput').value;
    const sortBy = document.getElementById('sortSelect').value;

    fetch(`{{ url_for("viewer_15m.get_stocks") }}?page=${page}&per_page=50&search=${encodeURIComponent(search)}&sort_by=${sortBy}`)
        .then(r => r.json())
        .then(d => {
            if (d.error) {
                document.getElementById('stockList').innerHTML = '<div class="loading-msg">加载失败</div>';
                return;
            }
            totalPages = d.total_pages || 1;
            document.getElementById('stockListInfo').textContent = `共 ${d.total} 只`;

            if (d.stocks.length === 0) {
                document.getElementById('stockList').innerHTML = '<div class="loading-msg">暂无数据</div>';
            } else {
                document.getElementById('stockList').innerHTML = d.stocks.map(s => `
                    <div class="stock-item ${selectedStock === s.code ? 'active' : ''}"
                         onclick="selectStock('${s.code}', '${s.name}')">
                        <div class="stock-info">
                            <div class="stock-code">${s.code}</div>
                            <div class="stock-name">${s.name}</div>
                        </div>
                        <div class="stock-meta">
                            <div class="stock-records">${s.records.toLocaleString()} 条</div>
                            <div class="stock-dates">${s.end_date} · ${s.time}</div>
                        </div>
                    </div>
                `).join('');
            }

            document.getElementById('stockPageInfo').textContent = `第 ${currentPage} / ${totalPages} 页`;
            document.getElementById('stockPrevBtn').disabled = currentPage <= 1;
            document.getElementById('stockNextBtn').disabled = currentPage >= totalPages;
        })
        .catch(e => {
            console.error('加载股票列表失败:', e);
            document.getElementById('stockList').innerHTML = '<div class="loading-msg">加载失败</div>';
        });
}

/* ===== 选择股票 ===== */
function selectStock(code, name) {
    selectedStock = code;
    currentDataPage = 1;

    document.getElementById('headerStockInfo').textContent = `${code} ${name || ''}`;

    document.querySelectorAll('.stock-item').forEach(item => {
        item.classList.remove('active');
        if (item.querySelector('.stock-code').textContent === code) {
            item.classList.add('active');
        }
    });

    document.getElementById('filterStartDate').value = '';
    document.getElementById('filterEndDate').value = '';

    if (drawerOpen) togglePanel();
    chartDataCache = null;
    if (currentView === 'chart') {
        loadChartData();
    }
    load15mData(1);
}

/* ===== 加载15m数据 ===== */
function load15mData(page) {
    if (!selectedStock) return;
    currentDataPage = page;

    const startDate = document.getElementById('filterStartDate').value;
    const endDate = document.getElementById('filterEndDate').value;

    let url = `{{ url_for("viewer_15m.get_stock_15m_data", stock_code="__CODE__") }}`.replace('__CODE__', selectedStock);
    url += `?page=${page}&per_page=100`;
    if (startDate) url += `&start_date=${startDate}`;
    if (endDate) url += `&end_date=${endDate}`;

    document.getElementById('dataTableBody').innerHTML =
        '<tr><td colspan="23" class="empty-cell">加载中...</td></tr>';

    fetch(url)
        .then(r => r.json())
        .then(d => {
            if (d.error) {
                document.getElementById('dataTableBody').innerHTML =
                    `<tr><td colspan="23" class="empty-cell">加载失败: ${d.error}</td></tr>`;
                return;
            }

            document.getElementById('detailTitle').textContent =
                `${d.stock_code} ${d.stock_name} 15分钟数据`;

            // 摘要
            if (d.total > 0) {
                const last = d.data[0];
                const sigClass = last.signal === 1 ? 'signal-up' : (last.signal === -1 ? 'signal-down' : '');
                const sigText = last.signal === 1 ? '上涨' : (last.signal === -1 ? '下跌' : '-');
                document.getElementById('stockSummary').innerHTML = `
                    <div class="summary-grid">
                        <div class="summary-item">
                            <div class="summary-value">${last.date}</div>
                            <div class="summary-label">最新时间</div>
                        </div>
                        <div class="summary-item">
                            <div class="summary-value">${last.close || '-'}</div>
                            <div class="summary-label">最新收盘价</div>
                        </div>
                        <div class="summary-item">
                            <div class="summary-value ${sigClass}">${sigText}</div>
                            <div class="summary-label">当前信号</div>
                        </div>
                        <div class="summary-item">
                            <div class="summary-value">${n(last.macd, 4)}</div>
                            <div class="summary-label">MACD</div>
                        </div>
                        <div class="summary-item">
                            <div class="summary-value">${last.boll_mid || '-'}</div>
                            <div class="summary-label">布林中轨</div>
                        </div>
                        <div class="summary-item">
                            <div class="summary-value">${last.stop_loss || '-'}</div>
                            <div class="summary-label">止损价</div>
                        </div>
                        <div class="summary-item">
                            <div class="summary-value">${d.total.toLocaleString()}</div>
                            <div class="summary-label">总记录数</div>
                        </div>
                    </div>
                `;
            } else {
                document.getElementById('stockSummary').innerHTML =
                    '<div class="summary-placeholder">该股票暂无15分钟数据</div>';
            }

            // 表格
            totalDataPages = d.total_pages || 1;
            if (d.data.length === 0) {
                document.getElementById('dataTableBody').innerHTML =
                    '<tr><td colspan="23" class="empty-cell">暂无数据</td></tr>';
                document.getElementById('dataPagination').style.display = 'none';
                return;
            }

            document.getElementById('dataTableBody').innerHTML = d.data.map(r => {
                const sigClass = r.signal === 1 ? 'signal-up' : (r.signal === -1 ? 'signal-down' : '');
                const sigText = r.signal === 1 ? '涨' : (r.signal === -1 ? '跌' : '-');
                const macdClass = r.macd > 0 ? 'macd-pos' : (r.macd < 0 ? 'macd-neg' : '');

                return `<tr>
                    <td>${r.date}</td>
                    <td>${n(r.open)}</td><td>${n(r.close)}</td>
                    <td>${n(r.high)}</td><td>${n(r.low)}</td>
                    <td>${ni(r.volume)}</td><td>${ni(r.money)}</td>
                    <td>${n(r.dif, 4)}</td><td>${n(r.dea, 4)}</td>
                    <td class="${macdClass}">${n(r.macd, 4)}</td>
                    <td class="${sigClass}">${sigText}</td>
                    <td>${r.signal_choice || '-'}</td>
                    <td style="font-size:0.7rem">${r.signal_start || '-'}</td>
                    <td>${n(r.boll_mid)}</td><td>${n(r.boll_up)}</td>
                    <td>${n(r.boll_dn)}</td><td>${n(r.stop_loss)}</td>
                    <td>${n(r.cyc_amp_bar, 4)}</td><td>${n(r.cyc_amp_max, 4)}</td>
                    <td>${ni(r.cyc_len_bar)}</td><td>${ni(r.cyc_len_max)}</td>
                    <td>${ni(r.vol_max1)}</td><td>${ni(r.vol_max5)}</td>
                </tr>`;
            }).join('');

            // 分页
            document.getElementById('dataPagination').style.display = 'flex';
            document.getElementById('dataPageInfo').textContent =
                `第 ${currentDataPage} / ${totalDataPages} 页 (共 ${d.total} 条)`;
            document.getElementById('dataPrevBtn').disabled = currentDataPage <= 1;
            document.getElementById('dataNextBtn').disabled = currentDataPage >= totalDataPages;
        })
        .catch(e => {
            console.error('加载15m数据失败:', e);
            document.getElementById('dataTableBody').innerHTML =
                '<tr><td colspan="23" class="empty-cell">加载失败</td></tr>';
        });
}

/* ===== 工具函数 ===== */
function n(v, d=2) {
    return (v !== null && v !== undefined) ? Number(v).toFixed(d) : '-';
}
function ni(v) {
    return (v !== null && v !== undefined && v !== 0) ? Number(v).toLocaleString() : '-';
}

/* ===== 快速搜索 ===== */
let qsTimeout = null;
function onQuickSearchInput() {
    clearTimeout(qsTimeout);
    const val = document.getElementById('quickSearchInput').value.trim();
    if (!val) {
        document.getElementById('quickSearchDropdown').classList.remove('show');
        return;
    }
    qsTimeout = setTimeout(() => {
        fetch(`{{ url_for("viewer_15m.get_stocks") }}?page=1&per_page=10&search=${encodeURIComponent(val)}&sort_by=records`)
            .then(r => r.json())
            .then(d => {
                const dd = document.getElementById('quickSearchDropdown');
                if (d.error || d.stocks.length === 0) {
                    dd.innerHTML = '<div class="qs-empty">未找到匹配股票</div>';
                } else {
                    dd.innerHTML = d.stocks.map(s => `
                        <div class="qs-item" onclick="quickSelectStock('${s.code}', '${s.name}')">
                            <div><span class="qs-code">${s.code}</span><span class="qs-name">${s.name}</span></div>
                            <div class="qs-meta">${s.records}条 · ${s.end_date}</div>
                        </div>
                    `).join('');
                }
                dd.classList.add('show');
            });
    }, 250);
}

function onQuickSearchFocus() {
    const val = document.getElementById('quickSearchInput').value.trim();
    if (val) onQuickSearchInput();
}

function quickSelectStock(code, name) {
    document.getElementById('quickSearchDropdown').classList.remove('show');
    document.getElementById('quickSearchInput').value = code + ' ' + name;
    selectStock(code, name);
}

document.addEventListener('click', function(e) {
    const wrap = document.querySelector('.quick-search-wrap');
    if (wrap && !wrap.contains(e.target)) {
        document.getElementById('quickSearchDropdown').classList.remove('show');
    }
});

/* ===== 筛选 ===== */
function onFilter() {
    chartDataCache = null;
    load15mData(1);
    if (currentView === 'chart') loadChartData();
}

/* ===== 视图切换 ===== */
function switchView(view) {
    currentView = view;
    document.getElementById('btnChartView').classList.toggle('active', view === 'chart');
    document.getElementById('btnTableView').classList.toggle('active', view === 'table');
    document.getElementById('chartSection').style.display = view === 'chart' ? 'block' : 'none';
    document.getElementById('tableSection').style.display = view === 'table' ? 'block' : 'none';

    if (view === 'chart' && selectedStock && !chartDataCache) {
        loadChartData();
    }
    if (view === 'chart' && klineChart) {
        klineChart.resize();
    }
}

function setChartRange(range) {
    chartRange = range;
    document.querySelectorAll('.range-btn').forEach(b => b.classList.remove('active'));
    event.target.classList.add('active');
    if (selectedStock) loadChartData();
}

/* ===== 加载图表数据 ===== */
function loadChartData() {
    if (!selectedStock) return;

    const startDate = document.getElementById('filterStartDate').value;
    const endDate = document.getElementById('filterEndDate').value;

    let url = `{{ url_for("viewer_15m.get_stock_15m_data", stock_code="__CODE__") }}`.replace('__CODE__', selectedStock);
    url += `?page=1&per_page=${chartRange}`;
    if (startDate) url += `&start_date=${startDate}`;
    if (endDate) url += `&end_date=${endDate}`;

    fetch(url)
        .then(r => r.json())
        .then(d => {
            if (d.error || !d.data || d.data.length === 0) {
                document.getElementById('klineChart').innerHTML =
                    '<div style="text-align:center;color:#9ca3af;padding:4rem;">暂无数据</div>';
                return;
            }
            chartDataCache = d;
            renderKlineChart(d);
        })
        .catch(e => {
            console.error('加载图表数据失败:', e);
            document.getElementById('klineChart').innerHTML =
                '<div style="text-align:center;color:#9ca3af;padding:4rem;">加载失败</div>';
        });
}

/* ===== 渲染K线图 ===== */
function renderKlineChart(d) {
    const container = document.getElementById('klineChart');
    if (!klineChart) {
        klineChart = echarts.init(container);
        window.addEventListener('resize', () => klineChart && klineChart.resize());
    }

    // 数据是倒序的（最新在前），需要反转
    const rawData = d.data.slice().reverse();

    const dates = [];
    const ohlc = [];      // [open, close, low, high]
    const volumes = [];
    const macdBars = [];
    const difLine = [];
    const deaLine = [];
    const bollMid = [];
    const bollUp = [];
    const bollDn = [];

    rawData.forEach((r, i) => {
        dates.push(r.date);
        ohlc.push([r.open, r.close, r.low, r.high]);
        const isUp = (r.close || 0) >= (r.open || 0);
        volumes.push([i, r.volume || 0, isUp ? 1 : -1]);
        macdBars.push(r.macd);
        difLine.push(r.dif);
        deaLine.push(r.dea);
        bollMid.push(r.boll_mid);
        bollUp.push(r.boll_up);
        bollDn.push(r.boll_dn);
    });

    const upColor = '#ef4444';
    const downColor = '#10b981';

    const option = {
        animation: false,
        tooltip: {
            trigger: 'axis',
            axisPointer: { type: 'cross' },
            backgroundColor: 'rgba(255,255,255,0.96)',
            borderColor: '#e5e7eb',
            textStyle: { fontSize: 12, color: '#1e293b' },
            formatter: function(params) {
                if (!params || params.length === 0) return '';
                const idx = params[0].dataIndex;
                const r = rawData[idx];
                if (!r) return '';
                const chg = r.open ? ((r.close - r.open) / r.open * 100).toFixed(2) : '0.00';
                const chgColor = chg >= 0 ? upColor : downColor;
                return `<div style="font-size:12px;line-height:1.6">
                    <b>${r.date}</b><br/>
                    <span style="color:#6b7280">开:</span> ${n(r.open)}
                    <span style="color:#6b7280;margin-left:8px">高:</span> ${n(r.high)}<br/>
                    <span style="color:#6b7280">收:</span> <b style="color:${chgColor}">${n(r.close)}</b>
                    <span style="color:#6b7280;margin-left:8px">低:</span> ${n(r.low)}<br/>
                    <span style="color:#6b7280">涨幅:</span> <b style="color:${chgColor}">${chg}%</b>
                    <span style="color:#6b7280;margin-left:8px">量:</span> ${ni(r.volume)}<br/>
                    <span style="color:#7c3aed">DIF:</span> ${n(r.dif,4)}
                    <span style="color:#d97706;margin-left:6px">DEA:</span> ${n(r.dea,4)}
                    <span style="color:#6b7280;margin-left:6px">MACD:</span> ${n(r.macd,4)}<br/>
                    <span style="color:#2563eb">布林:</span> ${n(r.boll_up)} / ${n(r.boll_mid)} / ${n(r.boll_dn)}
                </div>`;
            }
        },
        axisPointer: {
            link: [{ xAxisIndex: [0, 1, 2] }],
            label: { backgroundColor: '#64748b' }
        },
        grid: [
            { left: 60, right: 20, top: 20, height: '48%' },   // K线
            { left: 60, right: 20, top: '72%', height: '10%' }, // 成交量
            { left: 60, right: 20, top: '85%', height: '12%' }, // MACD
        ],
        xAxis: [
            {
                type: 'category', data: dates, gridIndex: 0,
                axisLine: { lineStyle: { color: '#d1d5db' } },
                axisLabel: { show: false },
                axisTick: { show: false },
                splitLine: { show: true, lineStyle: { color: '#f1f5f9' } },
                boundaryGap: true,
                min: 'dataMin', max: 'dataMax',
            },
            {
                type: 'category', data: dates, gridIndex: 1,
                axisLine: { lineStyle: { color: '#d1d5db' } },
                axisLabel: { show: false },
                axisTick: { show: false },
                splitLine: { show: false },
                boundaryGap: true,
                min: 'dataMin', max: 'dataMax',
            },
            {
                type: 'category', data: dates, gridIndex: 2,
                axisLine: { lineStyle: { color: '#d1d5db' } },
                axisLabel: { fontSize: 10, color: '#9ca3af', rotate: 30 },
                axisTick: { show: false },
                splitLine: { show: false },
                boundaryGap: true,
                min: 'dataMin', max: 'dataMax',
            },
        ],
        yAxis: [
            {
                scale: true, gridIndex: 0, splitNumber: 5,
                axisLine: { show: false },
                axisTick: { show: false },
                splitLine: { lineStyle: { color: '#f1f5f9' } },
                axisLabel: { fontSize: 10, color: '#9ca3af' },
            },
            {
                scale: true, gridIndex: 1,
                axisLine: { show: false },
                axisTick: { show: false },
                splitLine: { show: false },
                axisLabel: { show: false },
            },
            {
                scale: true, gridIndex: 2, splitNumber: 2,
                axisLine: { show: false },
                axisTick: { show: false },
                splitLine: { lineStyle: { color: '#f1f5f9' } },
                axisLabel: { fontSize: 10, color: '#9ca3af' },
            },
        ],
        dataZoom: [
            {
                type: 'inside', xAxisIndex: [0, 1, 2],
                start: Math.max(0, 100 - Math.min(100, 80 / rawData.length * 100)),
                end: 100,
            },
            {
                type: 'slider', xAxisIndex: [0, 1, 2],
                bottom: 5, height: 18,
                borderColor: '#d1d5db',
                fillerColor: 'rgba(8,145,178,0.12)',
                handleStyle: { color: '#0891b2' },
                textStyle: { fontSize: 10, color: '#9ca3af' },
                start: Math.max(0, 100 - Math.min(100, 80 / rawData.length * 100)),
                end: 100,
            },
        ],
        series: [
            // K线
            {
                name: 'K线', type: 'candlestick', xAxisIndex: 0, yAxisIndex: 0,
                data: ohlc,
                itemStyle: {
                    color: upColor, color0: downColor,
                    borderColor: upColor, borderColor0: downColor,
                },
            },
            // 布林上轨
            {
                name: '上轨', type: 'line', xAxisIndex: 0, yAxisIndex: 0,
                data: bollUp, smooth: true,
                lineStyle: { color: '#3b82f6', width: 1, opacity: 0.6 },
                symbol: 'none',
            },
            // 布林中轨
            {
                name: '中轨', type: 'line', xAxisIndex: 0, yAxisIndex: 0,
                data: bollMid, smooth: true,
                lineStyle: { color: '#f59e0b', width: 1, opacity: 0.6 },
                symbol: 'none',
            },
            // 布林下轨
            {
                name: '下轨', type: 'line', xAxisIndex: 0, yAxisIndex: 0,
                data: bollDn, smooth: true,
                lineStyle: { color: '#3b82f6', width: 1, opacity: 0.6 },
                symbol: 'none',
            },
            // 成交量
            {
                name: '成交量', type: 'bar', xAxisIndex: 1, yAxisIndex: 1,
                data: volumes.map(v => ({
                    value: v[1],
                    itemStyle: { color: v[2] > 0 ? upColor : downColor, opacity: 0.7 }
                })),
            },
            // MACD柱
            {
                name: 'MACD', type: 'bar', xAxisIndex: 2, yAxisIndex: 2,
                data: macdBars.map(v => ({
                    value: v,
                    itemStyle: { color: v >= 0 ? upColor : downColor, opacity: 0.8 }
                })),
            },
            // DIF线
            {
                name: 'DIF', type: 'line', xAxisIndex: 2, yAxisIndex: 2,
                data: difLine,
                lineStyle: { color: '#7c3aed', width: 1.2 },
                symbol: 'none',
            },
            // DEA线
            {
                name: 'DEA', type: 'line', xAxisIndex: 2, yAxisIndex: 2,
                data: deaLine,
                lineStyle: { color: '#d97706', width: 1.2 },
                symbol: 'none',
            },
        ],
    };

    klineChart.setOption(option, true);
}

/* ===== 刷新 ===== */
function refreshAll() {
    loadStockList(currentPage);
    if (selectedStock) {
        load15mData(currentDataPage);
        if (currentView === 'chart') loadChartData();
    }
}
</script>
{% endblock %}
