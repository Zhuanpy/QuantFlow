{% extends "base.html" %}

{% block content %}
<div class="container">
    <div class="page-header">
        <div>
            <h1>板块数据管理</h1>
            <p>板块主表（eval_board）的统一维护：从行业/概念源同步、增删改、刷新成分股与市值。趋势打分见「板块趋势打分」，偏好评分见「板块偏好评分」。</p>
        </div>
        <div class="header-actions">
            <button class="btn btn-primary" onclick="openEditModal()">+ 新增板块</button>
            <button class="btn btn-outline" onclick="syncBoards()">⤓ 同步板块清单</button>
            <button class="btn btn-outline" onclick="refreshAllMembers()" title="从东方财富刷新所有行业板块成分股名单（约 86 个板块，2-5 分钟）">↻ 更新所有成分股</button>
            <button class="btn btn-outline" onclick="cleanupEmpty()">🧹 清理无数据板块</button>
        </div>
    </div>

    <div class="filter-bar">
        <label>分类
            <select id="filterClass" onchange="reload()">
                <option value="">全部</option>
                {% for c in classifications %}<option value="{{ c }}">{{ c }}</option>{% endfor %}
            </select>
        </label>
        <label>启用
            <select id="filterEnabled" onchange="reload()">
                <option value="">全部</option>
                <option value="1">启用</option>
                <option value="0">停用</option>
            </select>
        </label>
        <label>数据
            <select id="filterData" onchange="reload()">
                <option value="">全部</option>
                <option value="1">有日K</option>
                <option value="0">无日K</option>
            </select>
        </label>
        <label>排序
            <select id="filterSort" onchange="reload()">
                <option value="board_code">板块代码</option>
                <option value="member_desc">成分股多→少</option>
                <option value="updated">最近更新</option>
            </select>
        </label>
        <input type="text" id="filterCode" placeholder="板块代码" onkeydown="if(event.key==='Enter')reload()">
        <input type="text" id="filterName" placeholder="板块名称" onkeydown="if(event.key==='Enter')reload()">
        <button class="btn btn-sm" onclick="reload()">查询</button>
    </div>

    <div class="table-wrap">
        <table class="board-table">
            <thead>
                <tr>
                    <th>板块</th><th>分类</th><th>来源</th>
                    <th title="成分股数量（来自 industry_eastmoney 最新快照）">成分股</th>
                    <th title="日K/1m/15m 是否覆盖到最近交易日">数据</th>
                    <th>启用</th><th>备注</th><th>操作</th>
                </tr>
            </thead>
            <tbody id="tbody"><tr><td colspan="8" class="empty">加载中...</td></tr></tbody>
        </table>
    </div>

    <div class="pagination-wrap">
        <span id="pageInfo">共 0 条</span>
        <div id="pagination"></div>
    </div>
</div>

<!-- 编辑模态框 -->
<div class="modal" id="editModal" style="display:none;">
    <div class="modal-content" style="width:min(560px,95vw);">
        <div class="modal-header">
            <h3 id="editTitle">新增板块</h3>
            <button class="close-btn" onclick="closeEdit()">&times;</button>
        </div>
        <form onsubmit="submitEdit(event)">
            <input type="hidden" id="f_id">
            <div class="modal-body">
                <div class="row">
                    <label>板块代码 *<input type="text" id="f_board_code" required placeholder="如 BK0437"></label>
                    <label>板块名称<input type="text" id="f_board_name"></label>
                    <label>分类
                        <select id="f_classification">
                            {% for c in classifications %}<option value="{{ c }}">{{ c }}</option>{% endfor %}
                        </select>
                    </label>
                    <label>启用
                        <select id="f_enabled"><option value="1">启用</option><option value="0">停用</option></select>
                    </label>
                    <label class="full">备注<textarea id="f_notes" rows="2"></textarea></label>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-outline" onclick="closeEdit()">取消</button>
                <button type="submit" class="btn btn-primary">保存</button>
            </div>
        </form>
    </div>
</div>

<style>
    .container { max-width: 1200px; margin: 1rem auto; padding: 0 1rem; }
    .page-header { display:flex; justify-content:space-between; align-items:flex-start;
                   background:#fff; padding:1rem 1.25rem; border-radius:.6rem; box-shadow:var(--shadow-sm); margin-bottom:1rem; }
    .page-header h1 { margin:0 0 .25rem; }
    .page-header p { margin:0; color:#6b7280; font-size:.9rem; }
    .header-actions { display:flex; gap:.5rem; flex-wrap:wrap; }
    .btn { padding:.45rem .9rem; border-radius:.4rem; border:1px solid transparent; cursor:pointer; font-size:.85rem; text-decoration:none; display:inline-block; }
    .btn-primary { background:#2563eb; color:#fff; }
    .btn-outline { background:#fff; color:#374151; border-color:#d1d5db; }
    .btn-sm { padding:.3rem .65rem; font-size:.8rem; }
    .btn-danger { background:#ef4444; color:#fff; }
    .filter-bar { display:flex; flex-wrap:wrap; gap:.5rem; align-items:center; background:#fff;
                  padding:.6rem .75rem; border-radius:.5rem; margin-bottom:.75rem; box-shadow:var(--shadow-sm); font-size:.85rem; }
    .filter-bar label { display:flex; align-items:center; gap:.3rem; color:#374151; }
    .filter-bar select, .filter-bar input { padding:.3rem .5rem; border:1px solid #d1d5db; border-radius:.3rem; font-size:.85rem; }
    .table-wrap { background:#fff; border-radius:.5rem; padding:.5rem; box-shadow:var(--shadow-sm); overflow-x:auto; }
    .board-table { width:100%; border-collapse:collapse; font-size:.83rem; }
    .board-table th, .board-table td { padding:.5rem .55rem; border-bottom:1px solid #f1f5f9; text-align:right; white-space:nowrap; }
    .board-table th { background:#f9fafb; color:#374151; font-weight:600; text-align:center; }
    .board-table td:first-child, .board-table th:first-child { text-align:left; }
    .board-table tr:hover { background:#f9fafb; }
    .empty { text-align:center !important; color:#9ca3af; padding:1.5rem; }
    .board-link { color:inherit; text-decoration:none; }
    .board-link:hover strong { color:#2563eb; text-decoration:underline; }
    .cls-tag { display:inline-block; padding:.1rem .45rem; border-radius:.3rem; font-size:.74rem; background:#eef2ff; color:#3730a3; }
    .badge-on { color:#059669; } .badge-off { color:#9ca3af; }
    .ds-cell { display:inline-flex; gap:3px; align-items:center; padding:.1rem .3rem; border-radius:.3rem; cursor:help; }
    .ds-cell.ok{background:#d1fae5;} .ds-cell.lag{background:#fef3c7;} .ds-cell.stale{background:#fee2e2;} .ds-cell.missing{background:#fecaca;}
    .ds-dot { width:8px; height:8px; border-radius:50%; }
    .ds-dot.ok{background:#10b981;} .ds-dot.lag{background:#f59e0b;} .ds-dot.missing{background:#ef4444;}
    .ds-lag-num { font-size:.7rem; color:#6b7280; margin-left:2px; }
    .pagination-wrap { display:flex; justify-content:space-between; align-items:center; margin-top:.75rem; font-size:.85rem; color:#6b7280; }
    .pagination button { padding:.3rem .6rem; border:1px solid #d1d5db; background:#fff; border-radius:.3rem; margin:0 .15rem; cursor:pointer; }
    .modal { position:fixed; inset:0; background:rgba(0,0,0,.4); display:flex; align-items:center; justify-content:center; z-index:200; }
    .modal-content { background:#fff; border-radius:.6rem; max-height:90vh; overflow:auto; box-shadow:0 10px 40px rgba(0,0,0,.18); }
    .modal-header { display:flex; justify-content:space-between; align-items:center; padding:.85rem 1rem; border-bottom:1px solid #f1f5f9; }
    .modal-header h3 { margin:0; font-size:1.05rem; }
    .close-btn { background:none; border:none; font-size:1.4rem; cursor:pointer; color:#6b7280; }
    .modal-body { padding:.75rem 1rem; }
    .modal-footer { padding:.75rem 1rem; border-top:1px solid #f1f5f9; display:flex; justify-content:flex-end; gap:.5rem; }
    .row { display:grid; grid-template-columns: repeat(2, 1fr); gap:.5rem .75rem; }
    .row label { display:flex; flex-direction:column; font-size:.78rem; color:#4b5563; gap:.2rem; }
    .row label.full { grid-column:1 / -1; }
    .row input, .row select, .row textarea { padding:.35rem .5rem; border:1px solid #d1d5db; border-radius:.3rem; font-size:.85rem; }
</style>

<script>
let currentPage = 1;
const pageSize = 30;

function renderDataStatus(ds) {
    if (!ds) return '<span style="color:#9ca3af;">-</span>';
    const dotColor = (s) => (s === 'ok') ? 'ok' : (s === 'lag') ? 'lag' : 'missing';
    const lagSuffix = (ds.lag_days != null && ds.lag_days > 0) ? `<span class="ds-lag-num">${ds.lag_days}d</span>` : '';
    const tip = [
        `状态：${({ok:'正常',lag:'轻度滞后',stale:'严重滞后',missing:'无数据'})[ds.overall] || ds.overall}`,
        `日K  最新：${ds.latest_daily || '无'} (${ds.daily})`,
        `1m   最新：${ds.latest_1m || '无'} (${ds.min1})`,
        `15m  最新：${ds.latest_15m || '无'} (${ds.min15})`,
    ].join('\n');
    return `<span class="ds-cell ${ds.overall}" title="${tip}">`
         + `<span class="ds-dot ${dotColor(ds.daily)}"></span>`
         + `<span class="ds-dot ${dotColor(ds.min1)}"></span>`
         + `<span class="ds-dot ${dotColor(ds.min15)}"></span>${lagSuffix}</span>`;
}

async function reload() { currentPage = 1; loadList(); }

async function loadList() {
    const params = new URLSearchParams({
        page: currentPage, page_size: pageSize,
        classification: document.getElementById('filterClass').value,
        enabled: document.getElementById('filterEnabled').value,
        has_data: document.getElementById('filterData').value,
        sort_by: document.getElementById('filterSort').value,
        board_code: document.getElementById('filterCode').value,
        board_name: document.getElementById('filterName').value,
    });
    const r = await fetch('/board_data/api/list?' + params).then(r => r.json());
    const tbody = document.getElementById('tbody');
    if (!r.success) { tbody.innerHTML = `<tr><td colspan="8" class="empty">加载失败：${r.message || ''}</td></tr>`; return; }
    const items = r.data.items || [];
    if (!items.length) {
        tbody.innerHTML = `<tr><td colspan="8" class="empty">暂无板块。点「同步板块清单」从行业/概念源导入。</td></tr>`;
    } else {
        tbody.innerHTML = items.map(it => `
            <tr>
                <td><a href="/board_data/board?code=${it.board_code}" class="board-link" title="查看日K/15m/成分股"><strong>${it.board_code}</strong><br><span style="color:#6b7280;font-size:.78rem;">${it.board_name || ''}</span></a></td>
                <td style="text-align:center;"><span class="cls-tag">${it.classification || '-'}</span></td>
                <td style="text-align:center;color:#6b7280;">${it.source || '-'}</td>
                <td>${it.member_count == null ? '-' : it.member_count}</td>
                <td style="text-align:center;">${renderDataStatus(it.data_status)}</td>
                <td style="text-align:center;" class="${it.enabled ? 'badge-on' : 'badge-off'}">${it.enabled ? '✔' : '✕'}</td>
                <td style="max-width:200px;white-space:normal;text-align:left;color:#6b7280;">${it.notes || ''}</td>
                <td style="text-align:center;">
                    <button class="btn btn-sm btn-outline" onclick='openEditModal(${JSON.stringify(it)})'>编辑</button>
                    <button class="btn btn-sm btn-danger" onclick="delRow(${it.id})">删除</button>
                </td>
            </tr>`).join('');
    }
    renderPagination(r.data.pagination);
    document.getElementById('pageInfo').textContent = `共 ${r.data.pagination.total} 条`;
}

function renderPagination(p) {
    const div = document.getElementById('pagination');
    if (!p || p.pages <= 1) { div.innerHTML = ''; return; }
    div.innerHTML = `<button ${p.has_prev ? '' : 'disabled'} onclick="goPage(${p.page - 1})">上一页</button>`
        + `<span style="margin:0 .5rem;">${p.page}/${p.pages}</span>`
        + `<button ${p.has_next ? '' : 'disabled'} onclick="goPage(${p.page + 1})">下一页</button>`;
}
function goPage(p) { currentPage = p; loadList(); }

function openEditModal(row) {
    document.getElementById('editTitle').textContent = row && row.id ? '编辑板块' : '新增板块';
    document.getElementById('f_id').value = row && row.id ? row.id : '';
    document.getElementById('f_board_code').value = row ? (row.board_code || '') : '';
    document.getElementById('f_board_code').readOnly = !!(row && row.id);
    document.getElementById('f_board_name').value = row ? (row.board_name || '') : '';
    document.getElementById('f_classification').value = row ? (row.classification || '自定义') : '自定义';
    document.getElementById('f_enabled').value = (row && row.enabled === false) ? '0' : '1';
    document.getElementById('f_notes').value = row ? (row.notes || '') : '';
    document.getElementById('editModal').style.display = 'flex';
}
function closeEdit() { document.getElementById('editModal').style.display = 'none'; }

async function submitEdit(ev) {
    ev.preventDefault();
    const id = document.getElementById('f_id').value;
    const payload = {
        board_code: document.getElementById('f_board_code').value.trim(),
        board_name: document.getElementById('f_board_name').value.trim(),
        classification: document.getElementById('f_classification').value,
        enabled: document.getElementById('f_enabled').value === '1',
        notes: document.getElementById('f_notes').value,
    };
    const url = id ? `/board_data/api/update/${id}` : '/board_data/api/create';
    const method = id ? 'PUT' : 'POST';
    const r = await fetch(url, { method, headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) }).then(r => r.json());
    if (!r.success) { alert('保存失败：' + (r.message || '')); return; }
    closeEdit(); loadList();
}

async function delRow(id) {
    if (!confirm('确定删除该板块？（仅删主表记录，不影响已有评分/成分股数据）')) return;
    const r = await fetch(`/board_data/api/delete/${id}`, { method: 'DELETE' }).then(r => r.json());
    if (!r.success) { alert('删除失败：' + (r.message || '')); return; }
    loadList();
}

async function syncBoards() {
    const source = prompt('选择数据源：industry（行业板块）/ concept（概念板块）/ all（全部）\n\n默认仅导入有日 K 数据的板块。', 'all');
    if (!source) return;
    if (!confirm(`将把【${source}】板块清单同步进主表（仅含有日 K 数据的板块）。继续？`)) return;
    const r = await fetch('/board_data/api/sync_boards', {
        method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ source }),
    }).then(r => r.json()).catch(() => ({ success: false, message: '请求失败' }));
    if (!r.success) { alert('同步失败：' + (r.message || '')); return; }
    const d = r.data;
    alert(`同步完成\n源中板块：${d.total_in_source}\n过滤无数据：${d.filtered_out_no_data}\n实际入表：${d.total_boards}（新建 ${d.created} / 更新 ${d.updated}）`);
    loadList();
}

async function cleanupEmpty() {
    if (!confirm('将从主表删除所有「无日 K 数据」的板块（source=manual 的手工板块保留）。继续？')) return;
    const r = await fetch('/board_data/api/cleanup_empty', {
        method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ keep_manual: true }),
    }).then(r => r.json()).catch(() => ({ success: false, message: '请求失败' }));
    if (!r.success) { alert('清理失败：' + (r.message || '')); return; }
    let msg = `清理完成：删除 ${r.data.deleted} 个`;
    if (r.data.sample && r.data.sample.length) msg += '\n样例：\n' + r.data.sample.slice(0, 8).map(x => `  ${x.board_code} ${x.board_name || ''}`).join('\n');
    alert(msg); loadList();
}

async function refreshAllMembers() {
    if (!confirm('将从东方财富刷新所有行业板块的成分股名单（约 86 个板块），可能需要 2-5 分钟。期间不要关闭页面。继续？')) return;
    const btn = event && event.target;
    if (btn) { btn.disabled = true; btn.textContent = '更新中...'; }
    try {
        const r = await fetch('/board_data/api/refresh_members', {
            method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({}),
        }).then(r => r.json()).catch(() => ({ success: false, message: '请求失败' }));
        if (!r.success) { alert('更新失败：' + (r.message || '')); return; }
        const d = r.data || {};
        let msg = `成分股名单更新完成（快照 ${d.snapshot_date}）\n请求 ${d.requested} / 成功 ${d.updated} / 空 ${d.empty} / 失败 ${d.failed_count}\n累计写入 ${d.total_members_written} 行`;
        if (d.failed_count > 0 && d.failed_sample && d.failed_sample.length) msg += '\n失败示例:\n' + d.failed_sample.slice(0, 5).map(e => `  ${e.board_code}: ${e.error}`).join('\n');
        alert(msg); loadList();
    } finally {
        if (btn) { btn.disabled = false; btn.textContent = '↻ 更新所有成分股'; }
    }
}

loadList();
</script>
{% endblock %}
