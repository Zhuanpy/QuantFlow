{% extends "base.html" %}

{% block content %}
<div class="container">
    <!-- 顶部统计 -->
    <div class="pool-header">
        <div class="header-left">
            <h1>股票池管理</h1>
            <p>管理交易、观察、候选股票池，追踪评分与状态</p>
        </div>
        <div class="header-actions">
            <button class="btn btn-primary" onclick="showAddModal()">+ 添加股票</button>
            <button class="btn btn-outline" onclick="showImportModal()">从记录导入</button>
            <button class="btn btn-outline" onclick="exportStocks()">导出</button>
            <a class="btn btn-outline" href="/trade/real?mode=real" target="_blank" title="打开交易管理(计划与成交)">📋 交易管理</a>
        </div>
    </div>

    <!-- 统计卡片 -->
    <div class="stats-row">
        <div class="stat-card trading">
            <div class="stat-num" id="statTrading">0</div>
            <div class="stat-text">交易中</div>
        </div>
        <div class="stat-card watching">
            <div class="stat-num" id="statWatching">0</div>
            <div class="stat-text">观察中</div>
        </div>
        <div class="stat-card candidate">
            <div class="stat-num" id="statCandidate">0</div>
            <div class="stat-text">候选池</div>
        </div>
        <div class="stat-card score">
            <div class="stat-num" id="statAvgScore">0</div>
            <div class="stat-text">平均评分</div>
        </div>
    </div>

    <!-- Tab 切换 -->
    <div class="tab-bar">
        <button class="tab active" data-type="" onclick="switchTab(this)">全部</button>
        <button class="tab" data-type="watching" onclick="switchTab(this)">观察</button>
        <button class="tab" data-type="candidate" onclick="switchTab(this)">候选</button>
        <button class="tab" data-type="trading" onclick="switchTab(this)">交易中</button>
        <div class="tab-right">
            <!-- 筛选 -->
            <select id="boardFilter" class="sort-select" onchange="loadStocks()" title="按所属板块（东财行业）筛选">
                <option value="">全部板块</option>
            </select>
            <select id="sortBy" class="sort-select" onchange="loadStocks()">
                <option value="priority">优先级排序</option>
                <option value="score_desc">评分从高到低</option>
                <option value="score_asc">评分从低到高</option>
                <option value="updated">最近更新</option>
                <option value="name">代码排序</option>
            </select>
            <!-- 搜索 -->
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="搜索代码/名称/标签..." onkeypress="if(event.key==='Enter')loadStocks()">
                <button onclick="loadStocks()">搜索</button>
            </div>
            <!-- 重置 -->
            <button class="reset-btn" onclick="resetFilters()" title="清空板块/排序/搜索并回到「全部」">重置</button>
        </div>
    </div>

    <!-- 批量操作栏 -->
    <div class="batch-bar" id="batchBar">
        <span>已选 <strong id="selectedCount">0</strong> 项</span>
        <div class="batch-actions">
            <button class="btn btn-sm" onclick="batchAddState('watching')" title="给选中的股票添加「观察」标签">+观察</button>
            <button class="btn btn-sm" onclick="batchAddState('candidate')" title="给选中的股票添加「候选」标签">+候选</button>
            <button class="btn btn-sm" onclick="batchAddState('trading')" title="给选中的股票添加「交易中」标签">+交易中</button>
            <button class="btn btn-sm btn-danger" onclick="batchRemove()">移出股票池</button>
            <button class="btn btn-sm" onclick="clearSelection()">取消</button>
        </div>
    </div>

    <!-- 高级工具栏：过滤 / 自动化 / 健康度 -->
    <div class="advanced-bar" style="background:#fff;border-radius:.5rem;padding:.6rem .75rem;margin-bottom:.75rem;display:flex;gap:.4rem;flex-wrap:wrap;align-items:center;box-shadow:var(--shadow-sm);font-size:.85rem;">
        <strong style="color:#6b7280;">高级操作:</strong>
        <button class="btn btn-sm btn-outline" onclick="openMarketScan()">🌐 全市场评分扫描</button>
        <button class="btn btn-sm btn-outline" onclick="openFilterDialog()">🔍 批量过滤当前池</button>
        <button class="btn btn-sm btn-outline" onclick="openRulesDialog()">⚙ 应用自动化规则</button>
        <button class="btn btn-sm btn-outline" onclick="openHealthScan()">💓 扫描观察池健康度</button>
    </div>

    <!-- 股票列表 -->
    <div class="stock-list" id="stockList">
        <div class="loading">加载中...</div>
    </div>

    <!-- 分页 -->
    <div class="pagination-wrap">
        <div id="pageInfo" class="page-info">共 0 条</div>
        <div id="pagination" class="pagination"></div>
    </div>
</div>

<!-- 添加股票模态框 -->
<div class="modal" id="addModal">
    <div class="modal-content">
        <div class="modal-header">
            <h3>添加股票</h3>
            <button class="close-btn" onclick="closeModal('addModal')">&times;</button>
        </div>
        <form onsubmit="addStock(event)">
            <div class="modal-body">
                <div class="form-row">
                    <div class="form-group ac-group">
                        <label>股票代码 *</label>
                        <input type="text" id="addCode" class="form-input" required placeholder="输入代码搜索" autocomplete="off">
                        <div class="ac-dropdown" id="addCodeDropdown"></div>
                    </div>
                    <div class="form-group ac-group">
                        <label>股票名称</label>
                        <input type="text" id="addName" class="form-input" placeholder="输入名称搜索" autocomplete="off">
                        <div class="ac-dropdown" id="addNameDropdown"></div>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>加入池</label>
                        <select id="addPoolType" class="form-input">
                            <option value="watching">观察中</option>
                            <option value="trading">交易中</option>
                            <option value="candidate">候选池</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>优先级</label>
                        <select id="addPriority" class="form-input">
                            <option value="1">1 - 低</option>
                            <option value="2">2</option>
                            <option value="3" selected>3 - 中</option>
                            <option value="4">4</option>
                            <option value="5">5 - 高</option>
                        </select>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>评分 (0-100)</label>
                        <input type="number" id="addScore" class="form-input" min="0" max="100" value="0" step="0.1">
                    </div>
                    <div class="form-group">
                        <label>行业</label>
                        <input type="text" id="addIndustry" class="form-input" placeholder="所属行业">
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>目标价</label>
                        <input type="number" id="addTargetPrice" class="form-input" step="0.01" placeholder="目标价格">
                    </div>
                    <div class="form-group">
                        <label>止损价</label>
                        <input type="number" id="addStopLoss" class="form-input" step="0.01" placeholder="止损价格">
                    </div>
                </div>
                <div class="form-group">
                    <label>标签</label>
                    <input type="text" id="addTags" class="form-input" placeholder="逗号分隔，如: 科技,龙头,机构重仓">
                </div>
                <div class="form-group">
                    <label>备注</label>
                    <textarea id="addNotes" class="form-input" rows="2" placeholder="关注理由或交易策略..."></textarea>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-outline" onclick="closeModal('addModal')">取消</button>
                <button type="submit" class="btn btn-primary">添加</button>
            </div>
        </form>
    </div>
</div>

<!-- 编辑股票模态框 -->
<div class="modal" id="editModal">
    <div class="modal-content">
        <div class="modal-header">
            <h3>编辑股票 - <span id="editTitle"></span></h3>
            <button class="close-btn" onclick="closeModal('editModal')">&times;</button>
        </div>
        <form onsubmit="saveEdit(event)">
            <input type="hidden" id="editId">
            <div class="modal-body">
                <div class="form-row">
                    <div class="form-group">
                        <label>股票代码</label>
                        <input type="text" id="editCode" class="form-input" readonly>
                    </div>
                    <div class="form-group">
                        <label>股票名称</label>
                        <input type="text" id="editName" class="form-input">
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>池类型</label>
                        <select id="editPoolType" class="form-input">
                            <option value="trading">交易中</option>
                            <option value="watching">观察中</option>
                            <option value="candidate">候选池</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>优先级</label>
                        <select id="editPriority" class="form-input">
                            <option value="1">1 - 低</option>
                            <option value="2">2</option>
                            <option value="3">3 - 中</option>
                            <option value="4">4</option>
                            <option value="5">5 - 高</option>
                        </select>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>综合评分</label>
                        <input type="number" id="editScore" class="form-input" min="0" max="100" step="0.1">
                    </div>
                    <div class="form-group">
                        <label>行业</label>
                        <input type="text" id="editIndustry" class="form-input">
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>目标价</label>
                        <input type="number" id="editTargetPrice" class="form-input" step="0.01">
                    </div>
                    <div class="form-group">
                        <label>止损价</label>
                        <input type="number" id="editStopLoss" class="form-input" step="0.01">
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>持仓比例 (%)</label>
                        <input type="number" id="editPosition" class="form-input" min="0" max="100" step="0.1">
                    </div>
                    <div class="form-group">
                        <label>板块</label>
                        <input type="text" id="editBoard" class="form-input">
                    </div>
                </div>
                <div class="form-group">
                    <label>标签</label>
                    <input type="text" id="editTags" class="form-input" placeholder="逗号分隔">
                </div>
                <div class="form-group">
                    <label>备注</label>
                    <textarea id="editNotes" class="form-input" rows="3"></textarea>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-outline" onclick="closeModal('editModal')">取消</button>
                <button type="submit" class="btn btn-primary">保存</button>
            </div>
        </form>
    </div>
</div>

<!-- 导入模态框 -->
<div class="modal" id="importModal">
    <div class="modal-content modal-sm">
        <div class="modal-header">
            <h3>从下载记录导入</h3>
            <button class="close-btn" onclick="closeModal('importModal')">&times;</button>
        </div>
        <form onsubmit="importFromRecords(event)">
            <div class="modal-body">
                <div class="form-group">
                    <label>导入到</label>
                    <select id="importPoolType" class="form-input">
                        <option value="candidate">候选池</option>
                        <option value="watching">观察中</option>
                    </select>
                </div>
                <p class="hint">将已成功下载的股票数据自动导入到股票池</p>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-outline" onclick="closeModal('importModal')">取消</button>
                <button type="submit" class="btn btn-primary">开始导入</button>
            </div>
        </form>
    </div>
</div>

<!-- 批量过滤对话框 -->
<div class="modal" id="filterModal">
    <div class="modal-content" style="max-width:600px;">
        <div class="modal-header">
            <h3>批量过滤当前池（<span id="filterPoolLabel">-</span>）</h3>
            <button class="close-btn" onclick="closeModal('filterModal')">&times;</button>
        </div>
        <div class="modal-body" style="padding:1rem;">
            <label style="display:flex;align-items:center;gap:.4rem;margin-bottom:.5rem;">
                <input type="checkbox" id="fltST" checked> 剔除 ST 股票（名称含 "ST"）
            </label>
            <label style="display:block;margin-bottom:.5rem;">
                近 60 日日均成交额阈值（元，留空跳过）：
                <input type="number" id="fltMoney" placeholder="例如 50000000 = 5000 万" style="width:100%;padding:.4rem;margin-top:.2rem;">
            </label>
            <label style="display:block;margin-bottom:.5rem;">
                市值阈值（元，留空跳过；仅 market_cap 字段有值时生效）：
                <input type="number" id="fltCap" placeholder="例如 5000000000 = 50 亿" style="width:100%;padding:.4rem;margin-top:.2rem;">
            </label>
            <div id="filterResultArea" style="margin-top:1rem;font-size:.85rem;color:#6b7280;"></div>
        </div>
        <div class="modal-footer" style="padding:.75rem 1rem;display:flex;gap:.5rem;justify-content:flex-end;">
            <button class="btn btn-outline" onclick="closeModal('filterModal')">取消</button>
            <button class="btn btn-primary" onclick="runFilterScan()">扫描</button>
            <button class="btn btn-danger" id="filterApplyBtn" onclick="applyFilterRemove()" style="display:none;">确认全部移出</button>
        </div>
    </div>
</div>

<!-- 自动化规则对话框 -->
<div class="modal" id="rulesModal">
    <div class="modal-content" style="max-width:600px;">
        <div class="modal-header">
            <h3>应用自动化规则</h3>
            <button class="close-btn" onclick="closeModal('rulesModal')">&times;</button>
        </div>
        <div class="modal-body" style="padding:1rem;">
            <label style="display:block;margin-bottom:.6rem;">
                候选池超过多少天未晋升 → 自动移出股票池（设 0 跳过）：
                <input type="number" id="rulesDays" value="30" min="0" max="365" style="width:100%;padding:.4rem;margin-top:.2rem;">
            </label>
            <label style="display:flex;align-items:center;gap:.4rem;margin-bottom:.4rem;">
                <input type="checkbox" id="rulesDegEnabled"> 检查观察池模型健康度（4 个全 DEGENERATE → 降级到候选）
            </label>
            <label style="display:block;margin-bottom:.6rem;color:#6b7280;font-size:.85rem;">
                月份模型（如 2026-04）：
                <input type="text" id="rulesDegMonth" placeholder="如 2026-04" style="width:100%;padding:.4rem;margin-top:.2rem;">
            </label>
            <div id="rulesResultArea" style="margin-top:.75rem;font-size:.85rem;color:#6b7280;"></div>
        </div>
        <div class="modal-footer" style="padding:.75rem 1rem;display:flex;gap:.5rem;justify-content:flex-end;">
            <button class="btn btn-outline" onclick="closeModal('rulesModal')">取消</button>
            <button class="btn btn-primary" onclick="runApplyRules()">应用规则</button>
        </div>
    </div>
</div>

<!-- 全市场扫描对话框 -->
<div class="modal" id="marketScanModal">
    <div class="modal-content" style="max-width:1000px;">
        <div class="modal-header">
            <h3>全市场评分扫描</h3>
            <button class="close-btn" onclick="closeModal('marketScanModal')">&times;</button>
        </div>
        <div class="modal-body" style="padding:1rem;">
            <div style="display:flex;gap:1rem;flex-wrap:wrap;align-items:end;margin-bottom:.75rem;">
                <label style="display:flex;align-items:center;gap:.4rem;"><input type="checkbox" id="scanExST" checked> 排除 ST</label>
                <label style="display:flex;align-items:center;gap:.4rem;"><input type="checkbox" id="scanExChinext" checked> 排除创业板（300/301）</label>
                <label style="display:flex;align-items:center;gap:.4rem;"><input type="checkbox" id="scanExKechuang"> 排除科创板（688）</label>
                <label style="display:flex;align-items:center;gap:.4rem;"><input type="checkbox" id="scanExBeijiao"> 排除北交所（8/4）</label>
                <label>Top N：<input type="number" id="scanTopN" value="100" min="10" max="500" style="width:80px;padding:.3rem;"></label>
                <button class="btn btn-primary btn-sm" onclick="runMarketScan()">开始扫描</button>
                <button class="btn btn-success btn-sm" id="addToCandidateBtn" onclick="addScanResultsToCandidate()" style="display:none;">+ 全部加入候选池</button>
            </div>
            <div id="marketScanResult" style="font-size:.82rem;color:#6b7280;">点"开始扫描"后，按综合评分排序的股票列表会显示在这里</div>
        </div>
    </div>
</div>

<!-- 健康度扫描对话框 -->
<div class="modal" id="healthModal">
    <div class="modal-content" style="max-width:760px;">
        <div class="modal-header">
            <h3>扫描观察池模型健康度</h3>
            <button class="close-btn" onclick="closeModal('healthModal')">&times;</button>
        </div>
        <div class="modal-body" style="padding:1rem;">
            <label style="display:block;margin-bottom:.6rem;">
                月份模型：
                <input type="text" id="healthMonth" placeholder="如 2026-04" style="width:100%;padding:.4rem;margin-top:.2rem;">
            </label>
            <div id="healthResult" style="margin-top:.75rem;font-size:.85rem;max-height:400px;overflow-y:auto;"></div>
        </div>
        <div class="modal-footer" style="padding:.75rem 1rem;display:flex;gap:.5rem;justify-content:flex-end;">
            <button class="btn btn-outline" onclick="closeModal('healthModal')">关闭</button>
            <button class="btn btn-primary" onclick="runHealthScan()">开始扫描</button>
        </div>
    </div>
</div>

<!-- Toast -->
<div class="toast-box" id="toastBox"></div>

<style>
.container { max-width: min(1920px, 98vw); margin: 0 auto; padding: 1rem 1.25rem; }
/* 表格在窄屏上允许横向滚动，避免列被挤压 */
.stock-list { overflow-x: auto; }
.stock-table { min-width: 1400px; }
.stock-table td, .stock-table th { white-space: nowrap; }
.notes-preview { max-width: 240px; }

/* 头部 */
.pool-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 1.5rem; }
.pool-header h1 { color: var(--primary-color); margin-bottom: 0.25rem; font-size: 1.8rem; }
.pool-header p { color: var(--text-secondary); font-size: 0.95rem; }
.header-actions { display: flex; gap: 0.5rem; }

/* 按钮 */
.btn { display: inline-flex; align-items: center; gap: 0.4rem; padding: 0.5rem 1rem; border: none; border-radius: 0.5rem; font-size: 0.9rem; font-weight: 500; cursor: pointer; transition: all 0.2s; }
.btn-primary { background: var(--primary-color); color: #fff; }
.btn-primary:hover { background: var(--secondary-color); }
.btn-outline { background: #fff; color: var(--text-primary); border: 1px solid #e2e8f0; }
.btn-outline:hover { border-color: var(--primary-color); color: var(--primary-color); }
/* .btn.btn-danger 提高优先级，压过后面 .btn-sm 的 background:#fff，
   否则「btn btn-sm btn-danger」会变成白底白字看不见。 */
.btn.btn-danger { background: #ef4444; color: #fff; border: none; }
.btn.btn-danger:hover { background: #dc2626; color: #fff; }
.btn-sm { padding: 0.35rem 0.75rem; font-size: 0.8rem; background: #fff; border: 1px solid #e2e8f0; border-radius: 0.4rem; }
.btn-sm:hover { border-color: var(--primary-color); color: var(--primary-color); }

/* 统计行 — 紧凑横条 */
.stats-row { display: flex; gap: .5rem; margin-bottom: .75rem; flex-wrap: wrap; }
.stat-card {
    background: #fff; border-radius: .5rem; padding: .35rem .75rem;
    box-shadow: var(--shadow-sm); border-left: 3px solid #e2e8f0;
    display: flex; align-items: baseline; gap: .5rem;
    flex: 1 1 auto; min-width: 130px;
}
.stat-card.trading   { border-left-color: #ef4444; }
.stat-card.watching  { border-left-color: #f59e0b; }
.stat-card.candidate { border-left-color: #3b82f6; }
.stat-card.archived  { border-left-color: #9ca3af; }
.stat-card.score     { border-left-color: #10b981; }
.stat-num  { font-size: 1.25rem; font-weight: 700; color: var(--text-primary); line-height: 1.1; }
.stat-text { font-size: .78rem; color: var(--text-secondary); }

/* Tab 栏 */
.tab-bar { display: flex; align-items: center; gap: 0.25rem; background: #fff; padding: 0.5rem; border-radius: 0.75rem; margin-bottom: 1rem; box-shadow: var(--shadow-sm); flex-wrap: wrap; }
.tab { padding: 0.5rem 1.2rem; border: none; background: none; border-radius: 0.5rem; font-size: 0.9rem; cursor: pointer; color: var(--text-secondary); font-weight: 500; transition: all 0.2s; }
.tab:hover { background: #f1f5f9; color: var(--text-primary); }
.tab.active { background: var(--primary-color); color: #fff; }
.tab-right { margin-left: auto; display: flex; gap: 0.5rem; align-items: center; }
.search-box { display: flex; border: 1px solid #e2e8f0; border-radius: 0.5rem; overflow: hidden; }
.search-box input { border: none; padding: 0.4rem 0.75rem; font-size: 0.85rem; width: 180px; outline: none; }
.search-box button { background: var(--primary-color); color: #fff; border: none; padding: 0.4rem 0.75rem; cursor: pointer; font-size: 0.85rem; }
.sort-select { padding: 0.4rem 0.6rem; border: 1px solid #e2e8f0; border-radius: 0.5rem; font-size: 0.85rem; background: #fff; cursor: pointer; }
.reset-btn { padding: 0.4rem 0.85rem; border: 1px solid #e2e8f0; border-radius: 0.5rem; font-size: 0.85rem; background: #fff; color: var(--text-secondary); cursor: pointer; white-space: nowrap; }
.reset-btn:hover { border-color: var(--primary-color); color: var(--primary-color); }

/* 批量操作 */

/* 操作按钮 */
.row-actions { display: flex; gap: 0.2rem; }
.act-btn { width: 28px; height: 28px; border: none; border-radius: 0.4rem; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.2s; font-size: 0.8rem; }
.act-btn.edit { background: #dbeafe; color: #2563eb; }

/* 上下文按钮（晋升/降级/排除）— 文字按钮，宽度自适应 */
.act-btn[class*="ctx-"] { width: auto; padding: 0 .55rem; font-size: .76rem; font-weight: 600; }

.notes-preview { max-width: 200px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 0.82rem; color: var(--text-secondary); }

/* 空状态 */

/* 分页 */
.pagination-wrap { display: flex; justify-content: space-between; align-items: center; margin-top: 1rem; }

.pg-btn { padding: 0.4rem 0.7rem; border: 1px solid #e2e8f0; background: #fff; border-radius: 0.4rem; cursor: pointer; font-size: 0.85rem; transition: all 0.2s; }
.pg-btn:hover:not(:disabled) { background: var(--primary-color); color: #fff; border-color: var(--primary-color); }

/* 模态框 */
.modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 1000; align-items: center; justify-content: center; }

.close-btn { background: none; border: none; font-size: 1.5rem; cursor: pointer; color: var(--text-secondary); line-height: 1; }
.modal-body { padding: 1.25rem; }
.modal-footer { padding: 0.75rem 1.25rem; border-top: 1px solid #e2e8f0; display: flex; justify-content: flex-end; gap: 0.5rem; }
.form-group { margin-bottom: 0.75rem; }
.form-group label { display: block; margin-bottom: 0.2rem; font-weight: 500; font-size: 0.85rem; color: var(--text-primary); }
.form-input { width: 100%; padding: 0.45rem 0.7rem; border: 1px solid #e2e8f0; border-radius: 0.4rem; font-size: 0.88rem; }

.ac-dropdown.show { display: block; }
.ac-item { padding: 0.45rem 0.7rem; cursor: pointer; display: flex; align-items: center; gap: 0.5rem; border-bottom: 1px solid #f1f5f9; font-size: 0.85rem; transition: background 0.15s; }
.ac-item:last-child { border-bottom: none; }
.ac-item:hover, .ac-item.active { background: #eff6ff; }
.ac-item .ac-code { font-weight: 600; color: var(--primary-color); min-width: 65px; }
.ac-item .ac-name { color: var(--text-primary); }

    .container { padding: 1rem; }

    .stats-row { grid-template-columns: repeat(2, 1fr); }
    .tab-bar { flex-direction: column; }
    .tab-right { margin-left: 0; width: 100%; }
    .form-row { grid-template-columns: 1fr; }
}
</style>

<script>
let currentPage = 1;
let currentPoolType = '';
let selectedIds = new Set();

document.addEventListener('DOMContentLoaded', () => {
    const params = new URLSearchParams(location.search);
    // 从 URL ?search=<code> 自动锚定（从 /trade/real 跳来时用）
    const qsSearch = params.get('search');
    if (qsSearch) {
        const input = document.getElementById('searchInput');
        if (input) input.value = qsSearch.trim();
    }
    // 从 URL ?tab=all|trading|watching|candidate 选中对应标签（兼容 ?pool_type=）
    let tab = (params.get('tab') || params.get('pool_type') || '').trim();
    if (tab === 'all') tab = '';
    setActiveTab(tab);
    loadStats();   // 内部会 loadBoards()，故此处不再单独调用
    loadStocks();
    setupStockAutocomplete('addCode', 'addName', 'addCodeDropdown', 'addNameDropdown');
});

// 拉取股票池里实际出现的板块，填充板块筛选下拉。
//   - 始终按当前活跃池重算（含数量），所以移除某板块全部股票后该项会消失/计数更新；
//   - 若当前选中的板块已无股票 → 复位为「全部」并刷新列表，避免卡在空板块。
async function loadBoards() {
    try {
        const r = await fetch('/stock_pool/api/boards');
        const d = await r.json();
        if (!d.success) return;
        const sel = document.getElementById('boardFilter');
        if (!sel) return;
        const cur = sel.value;
        const data = d.data || [];
        const codes = new Set(data.map(b => b.board_code));
        sel.innerHTML = '<option value="">全部板块</option>' +
            data.map(b => `<option value="${b.board_code}">${b.board_name}（${b.count}）</option>`).join('');
        if (cur && codes.has(cur)) {
            sel.value = cur;            // 选中板块仍有股票 → 保留
        } else if (cur) {
            sel.value = '';            // 选中板块已无股票 → 回到「全部」并重载列表
            loadStocks();
        }
    } catch (e) { /* 板块下拉失败不影响主列表 */ }
}

// 选中指定标签（type: ''=全部 / trading / watching / candidate；未知值回退到「全部」）
function setActiveTab(type) {
    let matched = false;
    document.querySelectorAll('.tab').forEach(t => {
        const on = (t.dataset.type || '') === (type || '');
        t.classList.toggle('active', on);
        if (on) matched = true;
    });
    if (!matched) {
        const allBtn = document.querySelector('.tab[data-type=""]');
        if (allBtn) allBtn.classList.add('active');
        type = '';
    }
    currentPoolType = type || '';
}

// 把当前标签 + 搜索写回 URL，便于分享/刷新/前进后退
function syncTabUrl() {
    const params = new URLSearchParams(location.search);
    if (currentPoolType) params.set('tab', currentPoolType);
    else params.delete('tab');                 // 「全部」= 不带 tab，URL 干净
    const sv = (document.getElementById('searchInput')?.value || '').trim();
    if (sv) params.set('search', sv); else params.delete('search');
    const qs = params.toString();
    history.replaceState(null, '', qs ? location.pathname + '?' + qs : location.pathname);
}

// === 统计 ===
async function loadStats() {
    try {
        const r = await fetch('/stock_pool/api/statistics');
        const d = await r.json();
        if (!d.success) return;

        const dist = d.data.type_distribution || {};
        document.getElementById('statTrading').textContent = dist.trading || 0;
        document.getElementById('statWatching').textContent = dist.watching || 0;
        document.getElementById('statCandidate').textContent = dist.candidate || 0;
        document.getElementById('statAvgScore').textContent = d.data.avg_score || 0;
    } catch(e) { console.error(e); }
    // 池子成分可能变了（增删/移出/移入）→ 同步刷新板块下拉。
    // loadStats() 是所有变更操作后的统一刷新点，挂这里即可覆盖全部入口。
    loadBoards();
}

// === Tab 切换 ===
function switchTab(el) {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    el.classList.add('active');
    currentPoolType = el.dataset.type;
    currentPage = 1;
    clearSelection();
    syncTabUrl();
    loadStocks();
}

// 重置：清空 板块/排序/搜索，回到「全部」标签
function resetFilters() {
    document.getElementById('searchInput').value = '';
    const bf = document.getElementById('boardFilter'); if (bf) bf.value = '';
    document.getElementById('sortBy').value = 'priority';
    setActiveTab('');
    currentPage = 1;
    clearSelection();
    syncTabUrl();
    loadStocks();
}

// === 加载列表 ===
async function loadStocks(page) {
    if (page) currentPage = page;
    const list = document.getElementById('stockList');
    list.innerHTML = '<div class="loading">加载中...</div>';

    const params = new URLSearchParams({
        page: currentPage,
        page_size: 20,
        pool_type: currentPoolType,
        search: document.getElementById('searchInput').value,
        board: (document.getElementById('boardFilter') || {}).value || '',
        sort_by: document.getElementById('sortBy').value,
        is_active: 'true'
    });

    try {
        const r = await fetch('/stock_pool/api/stocks?' + params);
        const d = await r.json();
        if (d.success) {
            renderTable(d.data.stocks);
            renderPagination(d.data.pagination);
            document.getElementById('pageInfo').textContent = `共 ${d.data.pagination.total} 条`;
        }
    } catch(e) {
        list.innerHTML = '<div class="empty-state"><h3>加载失败</h3></div>';
    }
}

function renderTable(stocks) {
    const list = document.getElementById('stockList');
    if (!stocks || !stocks.length) {
        list.innerHTML = '<div class="empty-state"><h3>暂无股票</h3><p>点击"添加股票"或"从记录导入"开始</p></div>';
        return;
    }

    // 观察池：尝试从 sessionStorage 读取最近一次健康度扫描结果
    const showHealth = currentPoolType === 'watching';
    let healthMap = {};
    if (showHealth) {
        // 取最新的 cache（任意月份；多个月份取最新写入的）
        for (let i = sessionStorage.length - 1; i >= 0; i--) {
            const k = sessionStorage.key(i);
            if (k && k.startsWith('health_')) {
                try { healthMap = JSON.parse(sessionStorage.getItem(k)) || {}; break; } catch (e) {}
            }
        }
    }
    const healthCol = showHealth ? '<th>健康度</th>' : '';

    let html = `<table class="stock-table">
        <thead><tr>
            <th class="col-cb"><input type="checkbox" onchange="toggleAll(this)"></th>
            <th>代码</th>
            <th>名称</th>
            <th>池</th>
            <th>评分</th>
            ${healthCol}
            <th>优先级</th>
            <th>所属板块</th>
            <th>目标价</th>
            <th>止损价</th>
            <th>现价</th>
            <th>更新</th>
            <th>操作</th>
        </tr></thead><tbody>`;

    // 现价单元格：根据目标/止损价用颜色提示
    const priceCell = (s) => {
        const cur = s.latest_close;
        if (cur == null) return '<span style="color:#9ca3af;font-size:.78rem;">-</span>';
        let color = '#374151', hint = '';
        if (s.target_price && cur >= s.target_price) {
            color = '#16a34a';  // 已达目标价 — 绿
            hint = '↑达标';
        } else if (s.stop_loss_price && cur <= s.stop_loss_price) {
            color = '#dc2626';  // 已破止损 — 红
            hint = '↓止损';
        } else if (s.target_price && s.stop_loss_price) {
            // 在区间内：按位置计算颜色（接近目标=绿；接近止损=红）
            const span = s.target_price - s.stop_loss_price;
            if (span > 0) {
                const pos = (cur - s.stop_loss_price) / span;
                if (pos >= 0.7) color = '#16a34a';
                else if (pos >= 0.3) color = '#ca8a04';
                else color = '#dc2626';
            }
        }
        const dateStr = s.latest_close_date ? `<div style="color:#9ca3af;font-size:.7rem;">${s.latest_close_date}</div>` : '';
        return `<div><span style="color:${color};font-weight:600;font-family:monospace;">${cur.toFixed(2)}</span>
                <span style="color:${color};font-size:.7rem;margin-left:.2rem;">${hint}</span>${dateStr}</div>`;
    };

    const healthBadge = (h) => {
        if (!h) return '<span style="color:#9ca3af;font-size:.78rem;">未扫描</span>';
        const palette = {HEALTHY:'#16a34a', WEAK:'#ca8a04', DEGENERATE:'#dc2626', UNTRAINED:'#9ca3af'};
        const c = palette[h.overall] || '#374151';
        return `<span style="color:${c};font-weight:600;font-size:.78rem;" title="per_model: ${h.per_model.join(' / ')}">${h.overall}</span>
                <span style="color:#6b7280;font-size:.72rem;margin-left:.25rem;">${h.healthy_count}/${h.total_models}</span>`;
    };

    stocks.forEach(s => {
        const scoreColor = s.score >= 80 ? '#10b981' : s.score >= 60 ? '#f59e0b' : s.score >= 40 ? '#3b82f6' : '#9ca3af';
        const trendIcon = s.score_trend > 0 ? '<span class="score-trend up">&#9650;</span>' : s.score_trend < 0 ? '<span class="score-trend down">&#9660;</span>' : '';
        const stars = '★'.repeat(s.pool_priority) + '☆'.repeat(5 - s.pool_priority);
        const healthCell = showHealth ? `<td>${healthBadge(healthMap[s.stock_code])}</td>` : '';

        // 板块单元格：有数据时给名字+代码做链接
        const boardCell = s.board_code
            ? `<a href="/board_data/board?code=${s.board_code}" target="_blank" title="查看 ${s.board_code} 板块趋势" style="color:#2563eb;text-decoration:none;">${s.board_name || s.board_code}<br><span style="color:#9ca3af;font-size:.7rem;">${s.board_code}</span></a>`
            : (s.industry || '-');

        html += `<tr>
            <td class="col-cb"><input type="checkbox" value="${s.id}" ${selectedIds.has(s.id)?'checked':''} onchange="toggleSel(${s.id})"></td>
            <td class="col-code"><a href="/stock_trend/stock/${s.stock_code}" target="_blank" title="查看 ${s.stock_code} 个股详情" style="color:#2563eb;text-decoration:none;font-weight:600;">${s.stock_code}</a></td>
            <td><a href="/stock_trend/stock/${s.stock_code}" target="_blank" title="查看 ${s.stock_name || s.stock_code} 个股详情" style="color:#2563eb;text-decoration:none;">${s.stock_name || '-'}</a></td>
            <td>${renderStateTags(s)}</td>
            <td><div class="score-cell">
                <span class="score-val" style="color:${scoreColor}">${s.score.toFixed(1)}</span>
                <div class="score-bar"><div class="score-fill" style="width:${s.score}%;background:${scoreColor}"></div></div>
                ${trendIcon}
                <a href="/stock_trend/stock/${s.stock_code}" target="_blank" title="查看趋势打分历史与日 K" class="score-link">📊</a>
            </div></td>
            ${healthCell}
            <td><span class="priority-stars">${stars}</span></td>
            <td>${boardCell}</td>
            <td>${s.target_price ? s.target_price.toFixed(2) : '-'}</td>
            <td>${s.stop_loss_price ? s.stop_loss_price.toFixed(2) : '-'}</td>
            <td>${priceCell(s)}</td>
            <td>${s.updated_at || '-'}</td>
            <td><div class="row-actions">
                ${renderPrimaryAction(s)}

            </div></td>
        </tr>`;
    });

    html += '</tbody></table>';
    list.innerHTML = html;
}

function renderPagination(p) {
    const el = document.getElementById('pagination');
    if (!p || p.pages <= 1) { el.innerHTML = ''; return; }
    let h = `<button class="pg-btn" onclick="loadStocks(${p.prev_num})" ${!p.has_prev?'disabled':''}>上一页</button>`;
    const s = Math.max(1, p.page-2), e = Math.min(p.pages, p.page+2);
    for (let i=s; i<=e; i++) h += `<button class="pg-btn ${i===p.page?'active':''}" onclick="loadStocks(${i})">${i}</button>`;
    h += `<button class="pg-btn" onclick="loadStocks(${p.next_num})" ${!p.has_next?'disabled':''}>下一页</button>`;
    el.innerHTML = h;
}

// === 行内「⋯ 更多」菜单：编辑 / 移动到(去掉当前池) / 删除 ===
// 统一所有次要操作入口，替代原先平铺的 编辑/移动/删除 + 重复的上下文移动按钮。
function showRowMenu(e, stockId, poolType, code) {
    e.stopPropagation();
    document.querySelectorAll('.dropdown-menu.show').forEach(m => m.remove());

    // 多状态下：加/减状态标签在「池」列用 ＋ / × 完成；此菜单只留 编辑 + 移出股票池
    const menu = document.createElement('div');
    menu.className = 'dropdown-menu show';
    menu.style.position = 'fixed';
    menu.style.left = e.clientX + 'px';
    menu.style.top = e.clientY + 'px';
    menu.innerHTML = `
        <button class="dropdown-item" onclick="editStock(${stockId})">&#9998; 编辑</button>
        <div class="dropdown-divider"></div>
        <button class="dropdown-item danger" onclick="removeStock(${stockId},'${code}')">&#8592; 移出股票池（清空所有状态）</button>
    `;
    document.body.appendChild(menu);

    // 菜单超出视口底部 → 向上翻
    const rect = menu.getBoundingClientRect();
    if (rect.bottom > window.innerHeight) menu.style.top = Math.max(8, e.clientY - rect.height) + 'px';
    if (rect.right > window.innerWidth) menu.style.left = Math.max(8, e.clientX - rect.width) + 'px';

    setTimeout(() => {
        document.addEventListener('click', function handler() {
            menu.remove();
            document.removeEventListener('click', handler);
        });
    }, 0);
}

async function runMarketScan() {
    const body = {
        exclude_st:       document.getElementById('scanExST').checked,
        exclude_chinext:  document.getElementById('scanExChinext').checked,
        exclude_kechuang: document.getElementById('scanExKechuang').checked,

    document.getElementById('addToCandidateBtn').style.display = 'none';

        const r = await fetch('/stock_pool/api/scan_market', {

            const ss = s.sub_scores || {};
            const fmt = (k) => ss[k] != null ? ss[k] : '—';
            const drawColor = s.max_drawdown_pct < -25 ? '#dc2626' : s.max_drawdown_pct < -15 ? '#ca8a04' : '#16a34a';

              <td style="padding:.3rem .5rem;text-align:right;color:${s.fund_momentum_raw > 0 ? '#16a34a' : (s.fund_momentum_raw < 0 ? '#dc2626' : '#9ca3af')};">${s.fund_momentum_raw >= 0 ? '+' : ''}${s.fund_momentum_raw}</td>

              <td style="padding:.3rem .5rem;color:#6b7280;font-size:.72rem;">趋势:${fmt('stock_trend')} RPS:${fmt('rps_60d')} 流:${fmt('liquidity')} 基:${fmt('fund_count')} 动:${fmt('fund_momentum')} 撤:${fmt('risk_drawdown')}</td>
            </tr>`;
        }).join('');

            <div style="margin-bottom:.5rem;">扫描完成，共 ${d.count} 只（按综合分降序）</div>
            <div style="max-height:520px;overflow-y:auto;border:1px solid #e5e7eb;border-radius:.4rem;">

                  <tr>
                    <th style="padding:.3rem .5rem;text-align:left;">#</th>
                    <th style="padding:.3rem .5rem;text-align:left;">代码</th>
                    <th style="padding:.3rem .5rem;text-align:left;">名称</th>
                    <th style="padding:.3rem .5rem;text-align:right;">总分</th>
                    <th style="padding:.3rem .5rem;text-align:right;">60d</th>
                    <th style="padding:.3rem .5rem;text-align:right;">基金</th>
                    <th style="padding:.3rem .5rem;text-align:right;">动量</th>
                    <th style="padding:.3rem .5rem;text-align:right;">回撤</th>
                    <th style="padding:.3rem .5rem;text-align:left;">子分（趋势/RPS/流动性/基金/动量/回撤）</th>
                  </tr>
                </thead>
                <tbody>${rows}</tbody>
              </table>

        document.getElementById('addToCandidateBtn').style.display = '';

        area.innerHTML = `<span style="color:#dc2626;">异常：${e.message}</span>`;
    }
}

    if (!month) { toast('请填月份', 'err'); return; }
    const area = document.getElementById('healthResult');
    area.innerHTML = '<em>扫描中…（每只股票要加载 4 个模型，预计每只 1 秒）</em>';
    try {
        const r = await fetch('/stock_pool/api/scan_health', {
            method: 'POST', headers: {'Content-Type':'application/json'},
            body: JSON.stringify({ pool_type: 'watching', month, sample_size: 30 })
        });
        const d = await r.json();
        if (!d.success) { area.innerHTML = `<span style="color:#dc2626;">${d.message}</span>`; return; }
        if (!d.data.length) { area.innerHTML = '观察池为空'; return; }
        // 缓存供观察池表格使用
        sessionStorage.setItem(`health_${month}`, JSON.stringify(
            Object.fromEntries(d.data.map(x => [x.stock_code, x]))
        ));
        const rows = d.data.map(s => {
            const colors = {HEALTHY:'#16a34a', WEAK:'#ca8a04', DEGENERATE:'#dc2626', UNTRAINED:'#9ca3af'};
            const c = colors[s.overall] || '#374151';
            return `<tr style="border-top:1px solid #e5e7eb;">
              <td style="padding:.25rem .5rem;">${s.stock_code}</td>
              <td style="padding:.25rem .5rem;">${s.stock_name||'-'}</td>
              <td style="padding:.25rem .5rem;"><span style="color:${c};font-weight:600;">${s.overall}</span></td>
              <td style="padding:.25rem .5rem;font-family:monospace;font-size:.78rem;">${s.healthy_count}/${s.total_models}</td>
              <td style="padding:.25rem .5rem;color:#6b7280;font-size:.78rem;">${s.per_model.join(' / ')}</td>
            </tr>`;
        }).join('');
        area.innerHTML = `
            <div style="margin-bottom:.5rem;">扫描了 ${d.count} 只观察股票（${month} 月份模型）</div>
            <table style="width:100%;font-size:.85rem;border-collapse:collapse;">
              <thead style="background:#f9fafb;">
                <tr><th style="padding:.3rem .5rem;text-align:left;">代码</th><th style="padding:.3rem .5rem;text-align:left;">名称</th><th style="padding:.3rem .5rem;text-align:left;">综合</th><th style="padding:.3rem .5rem;text-align:left;">HEALTHY</th><th style="padding:.3rem .5rem;text-align:left;">详情</th></tr>
              </thead><tbody>${rows}</tbody>
            </table>`;
    } catch (e) {
        area.innerHTML = `<span style="color:#dc2626;">异常：${e.message}</span>`;
    }
}

// === 工具 ===
function poolName(t) {
    return { trading: '交易中', watching: '观察中', candidate: '候选', archived: '归档', general: '通用', training: '训练', testing: '测试', validation: '验证' }[t] || t;
}

// 「池」列：渲染该股全部状态标签（每个带 × 可单独移除）+ 一个 ＋ 添加按钮
function renderStateTags(s) {
    const states = s.pool_states || [];
    const csv = states.join(',');
    const tags = states.map(st =>
        `<span class="pool-tag ${st}">${poolName(st)}<i class="tag-x" onclick="removeState(${s.id},'${st}')" title="移除${poolName(st)}">×</i></span>`
    ).join(' ');
    const add = `<button class="tag-add" onclick="showAddStateMenu(event,${s.id},'${csv}')" title="添加状态标签">＋</button>`;
    return `<div class="state-cell">${tags || '<span class="no-state">无状态</span>'}${add}</div>`;
}

// ＋ 添加状态：弹出"该股尚未拥有的状态"供选择
function showAddStateMenu(e, stockId, statesCsv) {
    e.stopPropagation();
    document.querySelectorAll('.dropdown-menu.show').forEach(m => m.remove());
    const have = new Set((statesCsv || '').split(',').filter(Boolean));
    const items = [['watching', '观察中'], ['candidate', '候选'], ['trading', '交易中']]
        .filter(([t]) => !have.has(t))
        .map(([t, label]) => `<button class="dropdown-item" onclick="addState(${stockId},'${t}')">+ ${label}</button>`)
        .join('');
    const menu = document.createElement('div');
    menu.className = 'dropdown-menu show';
    menu.style.position = 'fixed';
    menu.style.left = e.clientX + 'px';
    menu.style.top = e.clientY + 'px';
    menu.innerHTML = items || '<div class="dropdown-item" style="color:#9ca3af;cursor:default;">已包含全部状态</div>';
    document.body.appendChild(menu);
    const rect = menu.getBoundingClientRect();
    if (rect.bottom > window.innerHeight) menu.style.top = Math.max(8, e.clientY - rect.height) + 'px';
    if (rect.right > window.innerWidth) menu.style.left = Math.max(8, e.clientX - rect.width) + 'px';
    setTimeout(() => document.addEventListener('click', function h() { menu.remove(); document.removeEventListener('click', h); }), 0);
}

async function addState(stockId, state) {
    try {
        const r = await fetch('/stock_pool/api/add_state', {
            method: 'POST', headers: {'Content-Type':'application/json'},
            body: JSON.stringify({ stock_ids: [stockId], state })
        });
        const d = await r.json();
        if (d.success) { toast(d.message, 'ok'); loadStats(); loadStocks(); } else toast(d.message, 'err');
    } catch (e) { toast('添加状态失败', 'err'); }
}

async function removeState(stockId, state) {
    try {
        const r = await fetch('/stock_pool/api/remove_state', {
            method: 'POST', headers: {'Content-Type':'application/json'},
            body: JSON.stringify({ stock_ids: [stockId], state })
        });
        const d = await r.json();
        if (d.success) { toast(d.message, 'ok'); loadStats(); loadStocks(); } else toast(d.message, 'err');
    } catch (e) { toast('移除状态失败', 'err'); }
}

function toast(msg, type='ok') {
    const box = document.getElementById('toastBox');
    const el = document.createElement('div');
    el.className = 'toast ' + type;
    el.textContent = msg;
    box.appendChild(el);
    setTimeout(() => { el.style.animation = 'toastIn 0.3s ease reverse'; setTimeout(() => el.remove(), 300); }, 2500);
}

// === 股票自动补全 ===
function setupStockAutocomplete(codeId, nameId, codeDropId, nameDropId) {
    const codeInput = document.getElementById(codeId);
    const nameInput = document.getElementById(nameId);
    const codeDrop = document.getElementById(codeDropId);
    const nameDrop = document.getElementById(nameDropId);
    let timer = null;

    function onInput(input, dropdown) {
        clearTimeout(timer);
        const kw = input.value.trim();
        if (!kw) { dropdown.classList.remove('show'); return; }
        timer = setTimeout(() => acSearch(kw, dropdown, codeInput, nameInput), 200);
    }

    codeInput.addEventListener('input', () => onInput(codeInput, codeDrop));
    nameInput.addEventListener('input', () => onInput(nameInput, nameDrop));

    [codeInput, nameInput].forEach(input => {
        const drop = input === codeInput ? codeDrop : nameDrop;
        input.addEventListener('keydown', e => acKeydown(e, drop, codeInput, nameInput));
    });

    document.addEventListener('click', e => {
        if (!e.target.closest('.ac-group')) { codeDrop.classList.remove('show'); nameDrop.classList.remove('show'); }
    });
}

async function acSearch(keyword, dropdown, codeInput, nameInput) {
    try {
        const r = await fetch(`/api/trade/stocks/search?keyword=${encodeURIComponent(keyword)}`);
        const d = await r.json();
        if (d.success) acRender(dropdown, d.stocks, codeInput, nameInput);
    } catch(e) { console.error(e); }
}

function acRender(dropdown, stocks, codeInput, nameInput) {
    if (!stocks.length) {
        dropdown.innerHTML = '<div class="ac-empty">未找到匹配的股票</div>';
        dropdown.classList.add('show');
        return;
    }
    dropdown.innerHTML = stocks.map((s, i) =>
        `<div class="ac-item" data-code="${s.stock_code}" data-name="${s.stock_name}" data-index="${i}">
            <span class="ac-code">${s.stock_code}</span>
            <span class="ac-name">${s.stock_name}</span>
        </div>`
    ).join('');

    dropdown.querySelectorAll('.ac-item').forEach(item => {
        item.addEventListener('click', () => {
            codeInput.value = item.dataset.code;
            nameInput.value = item.dataset.name;
            dropdown.classList.remove('show');
        });
    });
    dropdown.classList.add('show');
}

function acKeydown(e, dropdown, codeInput, nameInput) {
    if (!dropdown.classList.contains('show')) return;
    const items = dropdown.querySelectorAll('.ac-item');
    if (!items.length) return;
    let idx = -1;
    items.forEach((it, i) => { if (it.classList.contains('active')) idx = i; });

    if (e.key === 'ArrowDown') {
        e.preventDefault(); items.forEach(it => it.classList.remove('active'));
        idx = (idx + 1) % items.length; items[idx].classList.add('active');
        items[idx].scrollIntoView({ block: 'nearest' });
    } else if (e.key === 'ArrowUp') {
        e.preventDefault(); items.forEach(it => it.classList.remove('active'));
        idx = idx <= 0 ? items.length - 1 : idx - 1; items[idx].classList.add('active');
        items[idx].scrollIntoView({ block: 'nearest' });
    } else if (e.key === 'Enter' && idx >= 0) {
        e.preventDefault();
        codeInput.value = items[idx].dataset.code;
        nameInput.value = items[idx].dataset.name;
        dropdown.classList.remove('show');
    } else if (e.key === 'Escape') { dropdown.classList.remove('show'); }
}
