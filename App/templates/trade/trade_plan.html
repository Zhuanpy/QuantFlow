{% extends "base.html" %}

{% block content %}
<div class="container">
    <div class="header">
        <h1>交易管理系统</h1>
        <p>模拟交易 & 实盘交易 - 计划、执行、统计</p>
    </div>

    <!-- 统计卡片 -->
    <div class="stats-grid" id="statsGrid">
        <div class="stat-card simulate">
            <h3>模拟交易</h3>
            <div class="stat-content">
                <div class="stat-item">
                    <span class="label">总交易</span>
                    <span class="value" id="simulateTotal">0</span>
                </div>
                <div class="stat-item">
                    <span class="label">胜率</span>
                    <span class="value win-rate" id="simulateWinRate">0%</span>
                </div>
                <div class="stat-item">
                    <span class="label">持仓中</span>
                    <span class="value" id="simulateActive">0</span>
                </div>
                <div class="stat-item">
                    <span class="label">盈亏比</span>
                    <span class="value" id="simulatePF">0</span>
                </div>
            </div>
        </div>
        <div class="stat-card real">
            <h3>实盘交易</h3>
            <div class="stat-content">
                <div class="stat-item">
                    <span class="label">总交易</span>
                    <span class="value" id="realTotal">0</span>
                </div>
                <div class="stat-item">
                    <span class="label">胜率</span>
                    <span class="value win-rate" id="realWinRate">0%</span>
                </div>
                <div class="stat-item">
                    <span class="label">持仓中</span>
                    <span class="value" id="realActive">0</span>
                </div>
                <div class="stat-item">
                    <span class="label">盈亏比</span>
                    <span class="value" id="realPF">0</span>
                </div>
            </div>
        </div>
    </div>

    <!-- 操作区 -->
    <div class="action-bar">
        <div class="mode-tabs">
            <button class="mode-tab active" data-mode="">全部</button>
            <button class="mode-tab" data-mode="simulate">模拟交易</button>
            <button class="mode-tab" data-mode="real">实盘交易</button>
        </div>
        <div class="action-buttons">
            <button class="btn btn-primary" onclick="showCreateModal()">+ 新建计划</button>
            <a class="btn btn-secondary" href="{{ url_for('stock_pool.stock_pool_page') }}" target="_blank">📋 股票池</a>
            <button class="btn btn-secondary" onclick="loadPlans()">刷新</button>
        </div>
    </div>

    <!-- 交易计划列表 -->
    <div class="plans-section">
        <h2>交易计划</h2>
        <div class="status-filter">
            <button class="status-btn active" data-status="">全部</button>
            <button class="status-btn" data-status="planning">计划中</button>
            <button class="status-btn" data-status="active">持仓中</button>
            <button class="status-btn" data-status="completed">已完成</button>
            <button class="status-btn" data-status="cancelled">已取消</button>
        </div>
        <div class="plans-table-wrapper">
            <table class="plans-table">
                <thead>
                    <tr>
                        <th>股票</th>
                        <th>模式</th>
                        <th>方向</th>
                        <th>计划时间</th>
                        <th>入场价</th>
                        <th>止损</th>
                        <th>止盈</th>
                        <th>数量</th>
                        <th>风险比</th>
                        <th>状态</th>
                        <th>盈亏</th>
                        <th>操作</th>
                    </tr>
                </thead>
                <tbody id="plansTableBody">
                    <tr><td colspan="12" class="loading">加载中...</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<!-- 新建/编辑交易计划模态框 -->
<div class="modal" id="planModal">
    <div class="modal-content">
        <div class="modal-header">
            <h3 id="modalTitle">新建交易计划</h3>
            <button class="close-btn" onclick="closeModal()">&times;</button>
        </div>
        <form id="planForm">
            <input type="hidden" id="planId">

            <div class="form-row">
                <div class="form-group stock-autocomplete-group">
                    <label>股票代码 *</label>
                    <input type="text" id="stockCode" required placeholder="输入代码搜索" autocomplete="off">
                    <div class="autocomplete-dropdown" id="stockCodeDropdown"></div>
                </div>
                <div class="form-group stock-autocomplete-group">
                    <label>股票名称 *</label>
                    <input type="text" id="stockName" required placeholder="输入名称搜索" autocomplete="off">
                    <div class="autocomplete-dropdown" id="stockNameDropdown"></div>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>交易模式</label>
                    <select id="tradeMode">
                        <option value="simulate">模拟交易</option>
                        <option value="real">实盘交易</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>交易方向</label>
                    <select id="direction">
                        <option value="long">做多</option>
                        <option value="short">做空</option>
                    </select>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>计划交易时间</label>
                    <input type="datetime-local" id="planTime">
                </div>
                <div class="form-group">
                    <label>计划过期时间</label>
                    <input type="datetime-local" id="expireTime">
                </div>
            </div>

            <div class="form-section">
                <h4>价格设置</h4>
                <div class="form-row">
                    <div class="form-group">
                        <label>预期入场价 *</label>
                        <input type="number" id="entryPrice" step="0.001" required>
                    </div>
                    <div class="form-group">
                        <label>目标价格</label>
                        <input type="number" id="targetPrice" step="0.001">
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>止损价格</label>
                        <input type="number" id="stopLossPrice" step="0.001">
                    </div>
                    <div class="form-group">
                        <label>止盈价格</label>
                        <input type="number" id="takeProfitPrice" step="0.001">
                    </div>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>交易数量 *</label>
                    <input type="number" id="quantity" value="100" required>
                </div>
                <div class="form-group">
                    <label>仓位比例 (%)</label>
                    <input type="number" id="positionRatio" step="0.1" placeholder="如: 10">
                </div>
            </div>

            <div class="form-group">
                <label>交易策略</label>
                <input type="text" id="strategyName" placeholder="使用的策略名称">
            </div>

            <div class="form-group">
                <label>入场理由</label>
                <textarea id="entryReason" rows="3" placeholder="记录入场的技术/基本面理由"></textarea>
            </div>

            <div class="form-group">
                <label>备注</label>
                <textarea id="notes" rows="2" placeholder="其他备注信息"></textarea>
            </div>

            <!-- 风险指标预览 -->
            <div class="risk-preview" id="riskPreview">
                <h4>风险指标预览</h4>
                <div class="risk-items">
                    <div class="risk-item">
                        <span>预期投入:</span>
                        <span id="previewAmount">-</span>
                    </div>
                    <div class="risk-item">
                        <span>最大亏损:</span>
                        <span id="previewMaxLoss">-</span>
                    </div>
                    <div class="risk-item">
                        <span>潜在盈利:</span>
                        <span id="previewProfit">-</span>
                    </div>
                    <div class="risk-item">
                        <span>风险收益比:</span>
                        <span id="previewRatio">-</span>
                    </div>
                </div>
            </div>

            <div class="form-actions">
                <button type="button" class="btn btn-secondary" onclick="closeModal()">取消</button>
                <button type="submit" class="btn btn-primary">保存</button>
            </div>
        </form>
    </div>
</div>

<!-- 入场/出场模态框 -->
<div class="modal" id="tradeActionModal">
    <div class="modal-content modal-small">
        <div class="modal-header">
            <h3 id="actionModalTitle">执行入场</h3>
            <button class="close-btn" onclick="closeActionModal()">&times;</button>
        </div>
        <form id="actionForm">
            <input type="hidden" id="actionPlanId">
            <input type="hidden" id="actionType">

            <div class="form-group">
                <label id="actionPriceLabel">实际入场价格</label>
                <input type="number" id="actionPrice" step="0.001" required>
            </div>
            <div class="form-group" id="actionQuantityGroup">
                <label>实际数量</label>
                <input type="number" id="actionQuantity">
            </div>
            <div class="form-group" id="actionReasonGroup" style="display:none;">
                <label>出场理由</label>
                <textarea id="actionReason" rows="2"></textarea>
            </div>

            <div class="form-actions">
                <button type="button" class="btn btn-secondary" onclick="closeActionModal()">取消</button>
                <button type="submit" class="btn btn-primary">确认</button>
            </div>
        </form>
    </div>
</div>

<script>
let currentMode = '';
let currentStatus = '';
let editingPlanId = null;

// 页面加载
document.addEventListener('DOMContentLoaded', function() {
    // 优先读 URL ?mode= 参数；其次取路由传入的 trade_mode；都没有则为"全部"
    const qsMode = new URLSearchParams(location.search).get('mode') || '';
    const routeMode = '{{ trade_mode|default("") }}';
    currentMode = qsMode || routeMode;
    if (currentMode) {
        document.querySelectorAll('.mode-tab').forEach(btn => {
            btn.classList.toggle('active', btn.dataset.mode === currentMode);
        });
    }
    syncStatsCards(currentMode);

    loadStatistics();
    loadPlans();
    setupEventListeners();

    // 浏览器前进/后退时，根据 URL 重新同步 tab + 列表
    window.addEventListener('popstate', () => {
        const m = new URLSearchParams(location.search).get('mode') || '';
        currentMode = m;
        document.querySelectorAll('.mode-tab').forEach(btn => {
            btn.classList.toggle('active', btn.dataset.mode === m);
        });
        syncStatsCards(m);
        loadPlans();
    });
});

// 把当前 mode 同步到 URL 查询参数，避免刷新/分享后丢失状态
function syncModeToUrl(mode) {
    const url = new URL(location.href);
    if (mode) url.searchParams.set('mode', mode);
    else url.searchParams.delete('mode');
    history.pushState({ mode }, '', url);
}

// 根据当前 mode 切换统计卡片可见性 + 网格列数：
//   ''        → 两张都显示，2 列
//   simulate  → 只显示模拟卡，撑满 1 列
//   real      → 只显示实盘卡，撑满 1 列
function syncStatsCards(mode) {
    const grid = document.getElementById('statsGrid');
    const sim = document.querySelector('.stat-card.simulate');
    const real = document.querySelector('.stat-card.real');
    if (sim) sim.style.display = (!mode || mode === 'simulate') ? '' : 'none';
    if (real) real.style.display = (!mode || mode === 'real') ? '' : 'none';
    if (grid) grid.classList.toggle('single', !!mode);
}

function setupEventListeners() {
    // 模式切换
    document.querySelectorAll('.mode-tab').forEach(btn => {
        btn.addEventListener('click', function() {
            document.querySelectorAll('.mode-tab').forEach(b => b.classList.remove('active'));
            this.classList.add('active');
            currentMode = this.dataset.mode;
            syncModeToUrl(currentMode);
            syncStatsCards(currentMode);
            loadPlans();
        });
    });

    // 状态筛选
    document.querySelectorAll('.status-btn').forEach(btn => {
        btn.addEventListener('click', function() {
            document.querySelectorAll('.status-btn').forEach(b => b.classList.remove('active'));
            this.classList.add('active');
            currentStatus = this.dataset.status;
            loadPlans();
        });
    });

    // 表单提交
    document.getElementById('planForm').addEventListener('submit', handleFormSubmit);
    document.getElementById('actionForm').addEventListener('submit', handleActionSubmit);

    // 价格变化时更新风险预览
    ['entryPrice', 'stopLossPrice', 'takeProfitPrice', 'quantity'].forEach(id => {
        document.getElementById(id).addEventListener('input', updateRiskPreview);
    });

    // 股票代码/名称自动补全
    setupStockAutocomplete();
}

// ============ 股票自动补全 ============
let searchTimer = null;
let activeDropdown = null;

function setupStockAutocomplete() {
    const codeInput = document.getElementById('stockCode');
    const nameInput = document.getElementById('stockName');
    const codeDropdown = document.getElementById('stockCodeDropdown');
    const nameDropdown = document.getElementById('stockNameDropdown');

    // 股票代码输入 → 搜索
    codeInput.addEventListener('input', function() {
        clearTimeout(searchTimer);
        const keyword = this.value.trim();
        if (keyword.length === 0) {
            hideDropdown(codeDropdown);
            return;
        }
        searchTimer = setTimeout(() => searchStocks(keyword, codeDropdown), 200);
    });

    // 股票名称输入 → 搜索
    nameInput.addEventListener('input', function() {
        clearTimeout(searchTimer);
        const keyword = this.value.trim();
        if (keyword.length === 0) {
            hideDropdown(nameDropdown);
            return;
        }
        searchTimer = setTimeout(() => searchStocks(keyword, nameDropdown), 200);
    });

    // 键盘导航
    [codeInput, nameInput].forEach(input => {
        const dropdown = input.id === 'stockCode' ? codeDropdown : nameDropdown;
        input.addEventListener('keydown', function(e) {
            handleDropdownKeydown(e, dropdown);
        });
    });

    // 点击外部关闭下拉
    document.addEventListener('click', function(e) {
        if (!e.target.closest('.stock-autocomplete-group')) {
            hideDropdown(codeDropdown);
            hideDropdown(nameDropdown);
        }
    });
}

async function searchStocks(keyword, dropdown) {
    try {
        const response = await fetch(`/api/trade/stocks/search?keyword=${encodeURIComponent(keyword)}`);
        const data = await response.json();

        if (data.success) {
            renderDropdown(dropdown, data.stocks);
        }
    } catch (error) {
        console.error('搜索股票失败:', error);
    }
}

function renderDropdown(dropdown, stocks) {
    if (stocks.length === 0) {
        dropdown.innerHTML = '<div class="autocomplete-empty">未找到匹配的股票（仅支持已整理的市场数据）</div>';
        dropdown.classList.add('show');
        return;
    }

    dropdown.innerHTML = stocks.map((s, i) => `
        <div class="autocomplete-item" data-code="${s.stock_code}" data-name="${s.stock_name}" data-index="${i}">
            <span class="stock-code">${s.stock_code}</span>
            <span class="stock-name">${s.stock_name}</span>
            <span class="stock-industry">${s.industry || ''}</span>
        </div>
    `).join('');

    // 绑定点击事件
    dropdown.querySelectorAll('.autocomplete-item').forEach(item => {
        item.addEventListener('click', function() {
            selectStock(this.dataset.code, this.dataset.name);
            hideDropdown(dropdown);
        });
    });

    dropdown.classList.add('show');
    activeDropdown = dropdown;
}

function selectStock(code, name) {
    document.getElementById('stockCode').value = code;
    document.getElementById('stockName').value = name;
}

function hideDropdown(dropdown) {
    dropdown.classList.remove('show');
    if (activeDropdown === dropdown) activeDropdown = null;
}

function handleDropdownKeydown(e, dropdown) {
    if (!dropdown.classList.contains('show')) return;

    const items = dropdown.querySelectorAll('.autocomplete-item');
    if (items.length === 0) return;

    let currentIndex = -1;
    items.forEach((item, i) => {
        if (item.classList.contains('active')) currentIndex = i;
    });

    if (e.key === 'ArrowDown') {
        e.preventDefault();
        items.forEach(item => item.classList.remove('active'));
        currentIndex = (currentIndex + 1) % items.length;
        items[currentIndex].classList.add('active');
        items[currentIndex].scrollIntoView({ block: 'nearest' });
    } else if (e.key === 'ArrowUp') {
        e.preventDefault();
        items.forEach(item => item.classList.remove('active'));
        currentIndex = currentIndex <= 0 ? items.length - 1 : currentIndex - 1;
        items[currentIndex].classList.add('active');
        items[currentIndex].scrollIntoView({ block: 'nearest' });
    } else if (e.key === 'Enter' && currentIndex >= 0) {
        e.preventDefault();
        const active = items[currentIndex];
        selectStock(active.dataset.code, active.dataset.name);
        hideDropdown(dropdown);
    } else if (e.key === 'Escape') {
        hideDropdown(dropdown);
    }
}

// 加载统计数据
async function loadStatistics() {
    try {
        const response = await fetch('/api/trade/statistics');
        const data = await response.json();

        if (data.success) {
            // 模拟交易统计
            document.getElementById('simulateTotal').textContent = data.simulate.total_trades;
            document.getElementById('simulateWinRate').textContent = data.simulate.win_rate + '%';
            document.getElementById('simulateActive').textContent = data.simulate.active_count;
            document.getElementById('simulatePF').textContent = data.simulate.profit_factor;

            // 实盘交易统计
            document.getElementById('realTotal').textContent = data.real.total_trades;
            document.getElementById('realWinRate').textContent = data.real.win_rate + '%';
            document.getElementById('realActive').textContent = data.real.active_count;
            document.getElementById('realPF').textContent = data.real.profit_factor;
        }
    } catch (error) {
        console.error('加载统计失败:', error);
    }
}

// 加载交易计划列表
async function loadPlans() {
    const tbody = document.getElementById('plansTableBody');
    tbody.innerHTML = '<tr><td colspan="12" class="loading">加载中...</td></tr>';

    try {
        let url = '/api/trade/plans?limit=100';
        if (currentMode) url += '&mode=' + currentMode;
        if (currentStatus) url += '&status=' + currentStatus;

        const response = await fetch(url);
        const data = await response.json();

        if (data.success && data.plans.length > 0) {
            tbody.innerHTML = data.plans.map(plan => renderPlanRow(plan)).join('');
        } else {
            tbody.innerHTML = '<tr><td colspan="12" class="loading">暂无交易计划</td></tr>';
        }
    } catch (error) {
        console.error('加载计划失败:', error);
        tbody.innerHTML = '<tr><td colspan="12" class="loading">加载失败</td></tr>';
    }
}

function renderPlanRow(plan) {
    const profitClass = plan.profit_loss > 0 ? 'profit-positive' : (plan.profit_loss < 0 ? 'profit-negative' : '');
    const profitDisplay = plan.profit_loss !== null ?
        `<span class="${profitClass}">${plan.profit_loss > 0 ? '+' : ''}${plan.profit_loss.toFixed(2)}</span>` : '-';

    // 格式化计划时间：显示入场时间 > 计划时间
    const timeStr = plan.entry_time || plan.plan_time || '';
    const timeDisplay = timeStr ? `<small>${timeStr.slice(0, 16).replace('T', ' ')}</small>` : '-';

    let actionButtons = '';
    if (plan.status === 'planning' || plan.status === 'pending') {
        actionButtons = `
            <button class="btn btn-success btn-sm" onclick="showEnterModal(${plan.id}, ${plan.entry_price})">入场</button>
            <button class="btn btn-secondary btn-sm" onclick="editPlan(${plan.id})">编辑</button>
            <button class="btn btn-danger btn-sm" onclick="cancelPlan(${plan.id})">取消</button>
        `;
    } else if (plan.status === 'active') {
        actionButtons = `
            <button class="btn btn-warning btn-sm" onclick="showExitModal(${plan.id})">出场</button>
            <button class="btn btn-secondary btn-sm" onclick="editPlan(${plan.id})">编辑</button>
        `;
    } else {
        actionButtons = `
            <button class="btn btn-secondary btn-sm" onclick="editPlan(${plan.id})">编辑</button>
            <button class="btn btn-danger btn-sm" onclick="deletePlan(${plan.id})">删除</button>
        `;
    }

    return `
        <tr>
            <td class="stock-cell"><strong>${plan.stock_code}</strong><span class="stock-name">${plan.stock_name || ''}</span></td>
            <td><span class="badge badge-${plan.trade_mode}">${plan.trade_mode === 'simulate' ? '模拟' : '实盘'}</span></td>
            <td><span class="badge badge-${plan.direction}">${plan.direction === 'long' ? '做多' : '做空'}</span></td>
            <td>${timeDisplay}</td>
            <td>${plan.entry_price || '-'}</td>
            <td>${plan.stop_loss_price || '-'}</td>
            <td>${plan.take_profit_price || '-'}</td>
            <td>${plan.quantity}</td>
            <td>${plan.risk_reward_ratio || '-'}</td>
            <td><span class="badge badge-${plan.status}">${getStatusText(plan.status)}</span></td>
            <td>${profitDisplay}</td>
            <td class="action-cell">${actionButtons}</td>
        </tr>
    `;
}

function getStatusText(status) {
    const map = {
        'planning': '计划中',
        'pending': '待执行',
        'active': '持仓中',
        'completed': '已完成',
        'cancelled': '已取消',
        'expired': '已过期'
    };
    return map[status] || status;
}

// 显示新建模态框
function showCreateModal() {
    editingPlanId = null;
    document.getElementById('modalTitle').textContent = '新建交易计划';
    document.getElementById('planForm').reset();
    document.getElementById('planModal').classList.add('active');
    updateRiskPreview();
}

// 编辑计划
async function editPlan(planId) {
    try {
        const response = await fetch(`/api/trade/plans/${planId}`);
        const data = await response.json();

        if (data.success) {
            editingPlanId = planId;
            const plan = data.plan;

            document.getElementById('modalTitle').textContent = '编辑交易计划';
            document.getElementById('stockCode').value = plan.stock_code;
            document.getElementById('stockName').value = plan.stock_name;
            document.getElementById('tradeMode').value = plan.trade_mode;
            document.getElementById('direction').value = plan.direction;
            document.getElementById('entryPrice').value = plan.entry_price || '';
            document.getElementById('targetPrice').value = plan.target_price || '';
            document.getElementById('stopLossPrice').value = plan.stop_loss_price || '';
            document.getElementById('takeProfitPrice').value = plan.take_profit_price || '';
            document.getElementById('quantity').value = plan.quantity;
            document.getElementById('positionRatio').value = plan.position_ratio || '';
            document.getElementById('planTime').value = plan.plan_time ? plan.plan_time.replace(' ', 'T').slice(0, 16) : '';
            document.getElementById('expireTime').value = plan.expire_time ? plan.expire_time.replace(' ', 'T').slice(0, 16) : '';
            document.getElementById('strategyName').value = plan.strategy_name || '';
            document.getElementById('entryReason').value = plan.entry_reason || '';
            document.getElementById('notes').value = plan.notes || '';

            document.getElementById('planModal').classList.add('active');
            updateRiskPreview();
        }
    } catch (error) {
        console.error('加载计划详情失败:', error);
        alert('加载计划详情失败');
    }
}

// 关闭模态框
function closeModal() {
    document.getElementById('planModal').classList.remove('active');
}

// 更新风险预览
function updateRiskPreview() {
    const entryPrice = parseFloat(document.getElementById('entryPrice').value) || 0;
    const stopLoss = parseFloat(document.getElementById('stopLossPrice').value) || 0;
    const takeProfit = parseFloat(document.getElementById('takeProfitPrice').value) || 0;
    const quantity = parseInt(document.getElementById('quantity').value) || 0;

    const amount = entryPrice * quantity;
    document.getElementById('previewAmount').textContent = amount > 0 ? '¥' + amount.toFixed(2) : '-';

    if (stopLoss > 0 && entryPrice > 0) {
        const maxLoss = Math.abs(entryPrice - stopLoss) * quantity;
        document.getElementById('previewMaxLoss').textContent = '¥' + maxLoss.toFixed(2);
    } else {
        document.getElementById('previewMaxLoss').textContent = '-';
    }

    if (takeProfit > 0 && entryPrice > 0) {
        const profit = Math.abs(takeProfit - entryPrice) * quantity;
        document.getElementById('previewProfit').textContent = '¥' + profit.toFixed(2);
    } else {
        document.getElementById('previewProfit').textContent = '-';
    }

    if (stopLoss > 0 && takeProfit > 0 && entryPrice > 0) {
        const risk = Math.abs(entryPrice - stopLoss);
        const reward = Math.abs(takeProfit - entryPrice);
        const ratio = risk > 0 ? (reward / risk).toFixed(2) : 0;
        document.getElementById('previewRatio').textContent = '1:' + ratio;
    } else {
        document.getElementById('previewRatio').textContent = '-';
    }
}

// 表单提交
async function handleFormSubmit(e) {
    e.preventDefault();

    const formData = {
        stock_code: document.getElementById('stockCode').value,
        stock_name: document.getElementById('stockName').value,
        trade_mode: document.getElementById('tradeMode').value,
        direction: document.getElementById('direction').value,
        entry_price: parseFloat(document.getElementById('entryPrice').value),
        target_price: parseFloat(document.getElementById('targetPrice').value) || null,
        stop_loss_price: parseFloat(document.getElementById('stopLossPrice').value) || null,
        take_profit_price: parseFloat(document.getElementById('takeProfitPrice').value) || null,
        quantity: parseInt(document.getElementById('quantity').value),
        position_ratio: parseFloat(document.getElementById('positionRatio').value) || null,
        plan_time: document.getElementById('planTime').value || null,
        expire_time: document.getElementById('expireTime').value || null,
        strategy_name: document.getElementById('strategyName').value,
        entry_reason: document.getElementById('entryReason').value,
        notes: document.getElementById('notes').value
    };

    try {
        const url = editingPlanId ? `/api/trade/plans/${editingPlanId}` : '/api/trade/plans';
        const method = editingPlanId ? 'PUT' : 'POST';

        const response = await fetch(url, {
            method: method,
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(formData)
        });

        const data = await response.json();

        if (data.success) {
            alert(data.message);
            closeModal();
            loadPlans();
            loadStatistics();
        } else {
            alert('操作失败: ' + data.message);
        }
    } catch (error) {
        console.error('提交失败:', error);
        alert('提交失败');
    }
}

// 入场模态框
function showEnterModal(planId, entryPrice) {
    document.getElementById('actionModalTitle').textContent = '执行入场';
    document.getElementById('actionPriceLabel').textContent = '实际入场价格';
    document.getElementById('actionPlanId').value = planId;
    document.getElementById('actionType').value = 'enter';
    document.getElementById('actionPrice').value = entryPrice || '';
    document.getElementById('actionQuantityGroup').style.display = 'block';
    document.getElementById('actionReasonGroup').style.display = 'none';
    document.getElementById('tradeActionModal').classList.add('active');
}

// 出场模态框
function showExitModal(planId) {
    document.getElementById('actionModalTitle').textContent = '执行出场';
    document.getElementById('actionPriceLabel').textContent = '实际出场价格';
    document.getElementById('actionPlanId').value = planId;
    document.getElementById('actionType').value = 'exit';
    document.getElementById('actionPrice').value = '';
    document.getElementById('actionQuantityGroup').style.display = 'none';
    document.getElementById('actionReasonGroup').style.display = 'block';
    document.getElementById('tradeActionModal').classList.add('active');
}

function closeActionModal() {
    document.getElementById('tradeActionModal').classList.remove('active');
}

// 入场/出场提交
async function handleActionSubmit(e) {
    e.preventDefault();

    const planId = document.getElementById('actionPlanId').value;
    const actionType = document.getElementById('actionType').value;
    const price = parseFloat(document.getElementById('actionPrice').value);

    const url = actionType === 'enter' ?
        `/api/trade/plans/${planId}/enter` :
        `/api/trade/plans/${planId}/exit`;

    const body = actionType === 'enter' ? {
        actual_price: price,
        actual_quantity: parseInt(document.getElementById('actionQuantity').value) || null
    } : {
        exit_price: price,
        exit_reason: document.getElementById('actionReason').value
    };

    try {
        const response = await fetch(url, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(body)
        });

        const data = await response.json();

        if (data.success) {
            alert(data.message);
            closeActionModal();
            loadPlans();
            loadStatistics();
        } else {
            alert('操作失败: ' + data.message);
        }
    } catch (error) {
        console.error('操作失败:', error);
        alert('操作失败');
    }
}

// 取消计划
async function cancelPlan(planId) {
    if (!confirm('确定要取消这个交易计划吗？')) return;

    try {
        const response = await fetch(`/api/trade/plans/${planId}/cancel`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' }
        });

        const data = await response.json();

        if (data.success) {
            loadPlans();
            loadStatistics();
        } else {
            alert('取消失败: ' + data.message);
        }
    } catch (error) {
        console.error('取消失败:', error);
    }
}

// 删除计划
async function deletePlan(planId) {
    if (!confirm('确定要删除这个交易计划吗？此操作不可恢复。')) return;

    try {
        const response = await fetch(`/api/trade/plans/${planId}`, {
            method: 'DELETE'
        });

        const data = await response.json();

        if (data.success) {
            loadPlans();
            loadStatistics();
        } else {
            alert('删除失败: ' + data.message);
        }
    } catch (error) {
        console.error('删除失败:', error);
    }
}

// 查看详情
async function viewPlan(planId) {
    await editPlan(planId);
    // 禁用编辑
    document.querySelectorAll('#planForm input, #planForm select, #planForm textarea').forEach(el => {
        el.disabled = true;
    });
    document.querySelector('#planForm .form-actions').style.display = 'none';
}
